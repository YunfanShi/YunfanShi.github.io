  <style>

    *{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:-.01em}button,input{font:inherit}button{touch-action:manipulation}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.app{width:min(1180px,100%);margin:auto;padding:28px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px}.eyebrow{margin:0 0 7px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.13em;text-transform:uppercase}h1{margin:0;font-size:clamp(28px,4vw,38px);font-weight:600;letter-spacing:-.045em}.subtitle{margin:9px 0 0;color:var(--muted)}.sync{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;white-space:nowrap}.sync i{width:8px;height:8px;border-radius:50%;background:var(--green)}
    .workspace{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.75fr);gap:18px;align-items:start}.card{border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow)}.timer-card{min-height:610px;display:flex;flex-direction:column;overflow:hidden}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:18px;padding:4px;border-radius:12px;background:var(--soft)}.tab{min-height:42px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;font-weight:600}.tab:hover{color:var(--text)}.tab.active{background:var(--card);color:var(--accent);box-shadow:0 1px 2px #3c40432e}.timer-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 28px 30px}.ring{width:min(330px,75vw);aspect-ratio:1;border-radius:50%;padding:11px;background:conic-gradient(var(--accent) var(--progress),var(--soft) 0)}.face{width:100%;height:100%;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-weight:500}.status i{width:8px;height:8px;border-radius:50%;background:var(--line)}.face.running .status i{background:var(--accent);animation:breathe 1.5s ease-in-out infinite}.time{margin:10px 0 14px;font-size:clamp(64px,10vw,94px);font-weight:650;line-height:1;letter-spacing:-.065em;font-variant-numeric:tabular-nums}.active-task{max-width:270px;overflow:hidden;color:var(--muted);text-overflow:ellipsis;white-space:nowrap}.active-task strong{color:var(--text)}.controls{display:flex;align-items:center;gap:10px;margin-top:28px}.control{height:46px;border-radius:23px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 18px;font-weight:600}.control:hover{background:var(--soft)}.control:active{transform:scale(.97)}.control.primary{min-wid     .side{display:grid;gap:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr)}.stat{padding:18px 12px;text-align:center}.stat+.stat{border-left:1px solid var(--line)}.stat strong{display:block;font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}.stat span{display:block;margin-top:4px;color:var(--muted);font-size:11px}.tasks{overflow:hidden}.section-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 14px}h2{margin:0;font-size:16px;font-weight:650}.count{border-radius:999px;background:var(--blue-soft);color:var(--blue);padding:4px 9px;font-size:11px;font-weight:650}.task-form{display:flex;gap:8px;padding:0 18px 16px}.task-form input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);padding:0 12px}.add{width:42px;height:42px;flex:0 0 42px;border:0;border-radius:10px;background:var(--blue);color:#fff;cursor:pointer;font-size:23px}.task-list{max-height:310px;overflow:auto;border-top:1px solid var(--line)}.empty{padding:38px 20px;color:var(--muted);text-align:center;line-height:1.6}.empty b{display:block;font-size:25px}.task{display:grid;grid-template-columns:25px minmax(0,1fr) auto 32px;gap:9px;align-items:center;min-height:58px;padding:8px 12px 8px 16px;border-bottom:1px solid var(--line);cursor:pointer}.task:last-child{border:0}.task:hover{background:var(--soft)}.task.selected{background:var(--blue-soft);box-shadow:inset 3px 0 var(--blue)}.check{width:22px;height:22px;border:2px solid var(--muted);border-radius:50%;background:transparent;color:transparent;cursor:pointer;padding:0}.task.done .check{border-color:var(--green);background:var(--green);color:#fff}.task-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.task.done .task-title{color:var(--muted);text-decoration:line-through}.estimate{color:var(--muted);font-size:12px;white-space:nowrap}.estimate button{border:0;background:transparent;color:inherit;cursor:pointer;padding:7px 3px}.del     dialog{width:min(440px,calc(100% - 28px));max-height:calc(100dvh - 28px);overflow:auto;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--text);padding:0;box-shadow:0 16px 48px #0000003d}dialog::backdrop{background:#20212473;backdrop-filter:blur(2px)}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 12px}.close{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--muted);cursor:pointer;font-size:22px}.settings{padding:8px 22px 22px}.setting{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:58px;border-bottom:1px solid var(--line)}.setting:last-child{border:0}.setting small{display:block;margin-top:3px;color:var(--muted)}.number{width:76px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);text-align:center}.switch{position:relative;width:44px;height:26px;flex:0 0 44px;border:0;border-radius:13px;background:var(--line);cursor:pointer}.switch:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0004;transition:transform .18s}.switch.on{background:var(--blue)}.switch.on:after{transform:translateX(18px)}.toast{position:fixed;left:50%;bottom:24px;z-index:20;max-width:calc(100% - 32px);transform:translate(-50%,18px);border-radius:999px;background:#202124;color:#fff;padding:11px 17px;box-shadow:0 6px 24px #0004;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes breathe{50%{opacity:.35;transform:scale(.78)}}
    .guide-presets{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:-6px 18px 0;color:var(--muted);font-size:12px}.guide-presets>span{margin-right:2px}.preset{min-height:34px;border:1px solid var(--line);border-radius:17px;background:var(--card);color:var(--text);padding:0 12px;cursor:pointer;font-weight:600}.preset:hover{background:var(--soft)}.preset.active{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
    .stats-card{overflow:hidden;cursor:pointer;transition:transform .16s,box-shadow .16s}.stats-card:hover{transform:translateY(-1px);box-shadow:0 3px 10px #3c404329}.stats-card:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.stats-card .stat strong{font-size:17px;line-height:1.25}.stats-link{display:flex;align-items:center;justify-content:center;gap:6px;border-top:1px solid var(--line);padding:10px;color:var(--blue);font-size:12px;font-weight:650}
    .stats-dialog{width:min(760px,calc(100% - 28px))}.stats-overview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:4px 22px 18px}.overview-item{border-radius:12px;background:var(--soft);padding:13px;text-align:center}.overview-item strong{display:block;font-size:17px}.overview-item span{display:block;margin-top:3px;color:var(--muted);font-size:11px}.calendar-wrap{display:grid;grid-template-columns:minmax(280px,1fr) minmax(250px,.9fr);gap:18px;padding:0 22px 22px}.calendar-panel,.day-panel{min-width:0;border:1px solid var(--line);border-radius:14px;padding:14px}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.calendar-nav{width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:var(--text);cursor:pointer;font-size:20px}.calendar-nav:hover{background:var(--soft)}.calendar-title{font-weight:650}.weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.weekdays span{padding:6px 0;color:var(--muted);font-size:10px;text-align:center}.calendar-day{min-height:45px;border:0;border-radius:9px;background:transparent;color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}.calendar-day:hover{background:var(--soft)}.calendar-day.today{box-shadow:inset 0 0 0 1px var(--blue)}.calendar-day.selected{background:var(--blue);color:#fff}.calendar-day small{min-height:12px;color:var(--blue);font-size:9px}.calendar-day.selected small{color:#fff}.calendar-blank{min-height:45px}.day-title{font-size:16px;font-weight:650}.day-subtitle{margin:3px 0 14px;color:var(--muted);font-size:11px}.day-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}.day-metric{border-radius:10px;background:var(--soft);padding:10px 6px;text-align:center}.day-metric strong{display:block;font-size:14px}.day-metric span{display:block;margin-top:2px;color:var(--muted);font-size:10px}.specs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.spec-chip{border-radius:999px;background:var(--blue-soft);color:var(--blue);padding:5px 9px;font-size:11px;font-weight:650}.session-list{max-height:220px;overflow:auto;margin:0;padding:0;list-style:none}.session-item{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.session-icon{font-size:17px}.session-copy{min-width:0}.session-copy strong,.session-copy small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.session-copy strong{font-size:12px}.session-copy small{color:var(--muted);font-size:10px}.session-duration{font-size:11px;font-weight:650}.no-sessions{padding:28px 8px;color:var(--muted);text-align:center}
    @media(max-width:860px){.app{padding:20px}.workspace{grid-template-columns:1fr}.timer-card{min-height:560px}.task-list{max-height:360px}}@media(max-width:620px){.stats-overview{grid-template-columns:repeat(2,1fr)}.calendar-wrap{grid-template-columns:1fr}.session-list{max-height:180px}}@media(max-width:540px){.app{padding:16px 12px calc(18px + env(safe-area-inset-bottom))}.page-head{align-items:flex-start;margin-bottom:16px}.sync{display:none}.timer-card{min-height:520px}.tabs{margin:12px}.guide-presets{margin:0 12px}.guide-presets>span{width:100%;text-align:center}.timer-main{padding:12px 16px 24px}.ring{width:min(270px,76vw);padding:9px}.time{font-size:clamp(58px,20vw,76px)}.controls{margin-top:22px}.shortcut{display:none}.control{padding:0 14px}.control.primary{min-width:124px}.task{padding-left:12px;gap:7px}.stats-dialog .dialog-head,.stats-overview,.calendar-wrap{padding-left:14px;padding-right:14px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>

<body>
  <main class="app">
    <header class="page-head"><div><p class="eyebrow">Focus timer</p><h1>番茄钟</h1><p class="subtitle">一次只做一件事，到点就好好休息。</p></div><div class="sync"><i></i>自动保存</div></header>
    <div class="workspace">
      <section class="card timer-card" aria-label="番茄计时器">
        <div class="tabs" role="tablist" aria-label="计时模式"><button class="tab active" data-mode="pomodoro" role="tab" aria-selected="true">专注</button><button class="tab" data-mode="short" role="tab">短休息</button><button class="tab" data-mode="long" role="tab">长休息</button></div>
        <div class="guide-presets" aria-label="StudyGuide 推荐节奏"><span>StudyGuide 推荐</span><button class="preset" data-preset="standard">25 + 5 标准</button><button class="preset" data-preset="deep">50 + 10 深度</button></div>
        <div class="timer-main"><div class="ring"><div class="face" id="face"><div class="status"><i></i><span id="status">准备开始</span></div><div class="time" id="time">25:00</div><div class="active-task" id="activeTask">还没有选择任务</div></div></div>
          <div class="controls"><button class="control" id="reset"><span>↺</span>重置</button><button class="control primary" id="start"><span id="startIcon">▶</span><span id="startText">开始专注</span></button><button class="control" id="skip">跳过 <span>→</span></button></div><p class="shortcut"><kbd>Space</kbd> 开始 / 暂停　<kbd>R</kbd> 重置</p></div>
      </section>
      <aside class="side">
        <section class="card stats-card" id="openStats" role="button" tabindex="0" aria-label="查看番茄钟统计日历"><div class="stats"><div class="stat"><strong id="focusToday">0分钟</strong><span>今日纯学习</span></div><div class="stat"><strong id="totalToday">0分钟</strong><span>今日含休息</span></div><div class="stat"><strong id="todayCount">0</strong><span>今日番茄</span></div></div><div class="stats-link">查看规格、明细与统计日历 <span>→</span></div></section>
        <section class="card tasks"><div class="section-head"><h2>专注任务</h2><span class="count" id="taskCount">0 个待完成</span></div><form class="task-form" id="taskForm"><input id="taskInput" maxlength="80" autocomplete="off" placeholder="添加今天要完成的事" aria-label="新任务"><button class="add" aria-label="添加任务">＋</button></form><div class="task-list" id="taskList"></div><div class="footer"><button class="text-button" id="openSettings">计时设置</button></div></section>
      </aside>
    </div>
  </main>
  <dialog id="settingsDialog"><div class="dialog-head"><h2>计时设置</h2><button class="close" id="closeSettings" aria-label="关闭">×</button></div><div class="settings">
    <label class="setting"><span>专注时长<small>10–90 分钟</small></span><input class="number" id="pomodoroMin" type="number" min="10" max="90"></label><label class="setting"><span>短休息<small>1–15 分钟</small></span><input class="number" id="shortBreakMin" type="number" min="1" max="15"></label><label class="setting"><span>长休息<small>5–30 分钟</small></span><input class="number" id="longBreakMin" type="number" min="5" max="30"></label><label class="setting"><span>长休息间隔<small>每完成几个番茄</small></span><input class="number" id="longBreakInterval" type="number" min="2" max="8"></label><div class="setting"><span>结束提示音<small>到点时播放轻提示音</small></span><button class="switch" id="soundEnabled" role="switch"></button></div><div class="setting"><span>桌面通知<small>页面在后台时也提醒</small></span><button class="switch" id="notificationsEnabled" role="switch"></button></div>
  </div></dialog>
  <dialog class="stats-dialog" id="statsDialog"><div class="dialog-head"><div><h2>专注统计</h2><div style="margin-top:3px;color:var(--muted);font-size:11px">完成的专注与休息计时会保存在本机，登录后同步到云端</div></div><button class="close" id="closeStats" aria-label="关闭">×</button></div><div class="stats-overview"><div class="overview-item"><strong id="sevenFocus">0分钟</strong><span>近 7 天学习</span></div><div class="overview-item"><strong id="sevenTotal">0分钟</strong><span>近 7 天含休息</span></div><div class="overview-item"><strong id="allPomodoros">0</strong><span>累计番茄</span></div><div class="overview-item"><strong id="allActiveDays">0</strong><span>累计活跃天</span></div></div><div class="calendar-wrap"><section class="calendar-panel" aria-label="统计日历"><div class="calendar-head"><button class="calendar-nav" id="prevMonth" aria-label="上个月">‹</button><span class="calendar-title" id="calendarTitle"></span><button class="calendar-nav" id="nextMonth" aria-label="下个月">›</button></div><div class="weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="calendar-grid" id="calendarGrid"></div></section><section class="day-panel" id="dayPanel" aria-live="polite"></section></div></dialog>
  <div class="toast" id="toast" role="status"></div>
  <script>
  (function(){'use strict';
    var KEY='jackyun_pomodoro_workspace_v1',modes={pomodoro:{label:'专注',color:'var(--blue)'},short:{label:'短休息',color:'var(--green)'},long:{label:'长休息',color:'var(--yellow)'}},defaults={pomodoroMin:25,shortBreakMin:5,longBreakMin:15,longBreakInterval:4,soundEnabled:true,notificationsEnabled:true};
    var state={mode:'pomodoro',seconds:1500,running:false,endsAt:0,cycle:0,activeTaskId:null,tasks:[],sessions:[],settings:Object.assign({},defaults)},ticker=null,toastTimer=null,selectedDate=new Date().toLocaleDateString('en-CA'),calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1),$=function(id){return document.getElementById(id)};
    function clamp(v,min,max){return Math.max(min,Math.min(max,Number(v)||min))}function duration(mode){return (mode==='pomodoro'?state.settings.pomodoroMin:mode==='short'?state.settings.shortBreakMin:state.settings.longBreakMin)*60}function fmt(v){v=Math.max(0,v);return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}function humanTime(seconds){var minutes=Math.round(Math.max(0,seconds)/60),hours=Math.floor(minutes/60),rest=minutes%60;return hours?(hours+'小时'+(rest?' '+rest+'分':'')):(minutes+'分钟')}function day(iso){return new Date(iso).toLocaleDateString('en-CA')}function id(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)}function escapeHtml(value){return String(value).replace(/[&<>"']/g,function(char){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]})}
    function taskShape(t){return{id:String(t.id||id()),text:String(t.text||t.title||'未命名任务').slice(0,80),estimated:clamp(t.estimated||1,1,12),completed:Boolean(t.completed),donePomodoros:Math.max(0,Number(t.donePomodoros)||0)}}function sessionShape(s){return{id:String(s.id||id()),completedAt:s.completedAt||new Date().toISOString(),durationSeconds:Math.max(0,Number(s.durationSeconds)||0),type:s.type==='break'?'break':'focus',mode:s.mode||'pomodoro',taskId:s.taskId||null,taskText:s.taskText||'',synced:Boolean(s.synced)}}function historyKey(session){return'jackyun_pomodoro_history_'+day(session.completedAt).slice(0,7)}function loadHistory(){var history=[];for(var i=0;i<localStorage.length;i++){var key=localStorage.key(i);if(key&&key.indexOf('jackyun_pomodoro_history_')===0)try{var entries=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(entries))history=history.concat(entries.map(sessionShape))}catch(e){}}return history}function saveHistorySession(session){try{var key=historyKey(session),entries=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(entries))entries=[];if(!entries.some(function(item){return item.id===session.id}))entries.push(session);localStorage.setItem(key,JSON.stringify(entries))}catch(e){}}
    function load(){try{var data=JSON.parse(localStorage.getItem(KEY)||'null'),legacySessions=[];if(data){state.tasks=Array.isArray(data.tasks)?data.tasks.map(taskShape):[];legacySessions=Array.isArray(data.sessions)?data.sessions.map(sessionShape):[];state.settings=Object.assign({},defaults,data.settings||{})}else{state.tasks=(JSON.parse(localStorage.getItem('jackyun_pomodoro_tasks')||'[]')||[]).map(taskShape);state.settings=Object.assign({},defaults,JSON.parse(localStorage.getItem('jackyun_pomodoro_settings')||'null')||{})}var combined=loadHistory().concat(legacySessions),seen={};state.sessions=combined.filter(function(session){if(seen[session.id])return false;seen[session.id]=true;return true});if(legacySessions.length){legacySessions.forEach(saveHistorySession);save()}state.seconds=duration(state.mode);state.cycle=state.sessions.filter(function(s){return s.type==='focus'&&day(s.completedAt)===new Date().toLocaleDateString('en-CA')}).length;var first=state.tasks.find(function(t){return!t.completed})||state.tasks[0];state.activeTaskId=first?first.id:null}catch(e){state.tasks=[];state.sessions=[];state.settings=Object.assign({},defaults)}}
    function save(){try{localStorage.setItem(KEY,JSON.stringify({tasks:state.tasks,settings:state.settings}))}catch(e){}}
    function syncFloating(type){try{parent.postMessage({type:type,panelId:'pomodoro',title:'番茄钟',primaryText:fmt(state.seconds),secondaryText:modes[state.mode].label+(state.running?'中':' · 已暂停'),running:state.running,statusColor:state.mode==='pomodoro'?'#34a853':'#4285f4',actionHref:'/pomodoro'},'*')}catch(e){}}
    function render(){var total=duration(state.mode),elapsed=total?Math.max(0,total-state.seconds)/total:0;document.documentElement.style.setProperty('--accent',modes[state.mode].color);document.documentElement.style.setProperty('--progress',Math.min(360,elapsed*360)+'deg');$('face').classList.toggle('running',state.running);$('time').textContent=fmt(state.seconds);$('status').textContent=state.running?modes[state.mode].label+'中':state.seconds<total?'已暂停':'准备开始';$('startIcon').textContent=state.running?'Ⅱ':'▶';$('startText').textContent=state.running?'暂停':state.seconds<total?'继续':state.mode==='pomodoro'?'开始专注':'开始休息';var current=state.tasks.find(function(t){return t.id===state.activeTaskId});$('activeTask').textContent=current?'当前：'+current.text:'还没有选择任务';document.title=fmt(state.seconds)+' · '+modes[state.mode].label+' | 番茄钟';document.querySelectorAll('.tab').forEach(function(b){var on=b.dataset.mode===state.mode;b.classList.toggle('active',on);b.setAttribute('aria-selected',String(on))});document.querySelectorAll('.preset').forEach(function(b){var on=b.dataset.preset==='standard'?state.settings.pomodoroMin===25&&state.settings.shortBreakMin===5:state.settings.pomodoroMin===50&&state.settings.shortBreakMin===10;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))});renderTasks();renderStats()}
    function renderTasks(){var open=state.tasks.filter(function(t){return!t.completed}).length;$('taskCount').textContent=open+' 个待完成';var list=$('taskList');if(!state.tasks.length){list.innerHTML='<div class="empty"><b>✓</b>添加一件事，然后开始第一个番茄</div>';return}list.replaceChildren();state.tasks.forEach(function(t){var row=document.createElement('div');row.className='task'+(t.completed?' done':'')+(t.id===state.activeTaskId?' selected':'');row.tabIndex=0;row.setAttribute('role','button');var check=document.createElement('button');check.className='check';check.textContent='✓';check.setAttribute('aria-label',t.completed?'标记为未完成':'标记为已完成');check.onclick=function(e){e.stopPropagation();t.completed=!t.completed;save();render()};var title=document.createElement('span');title.className='task-title';title.textContent=t.text;var estimate=document.createElement('span');estimate.className='estimate';var minus=document.createElement('button'),count=document.createElement('span'),plus=document.createElement('button');minus.textContent='−';plus.textContent='＋';count.textContent='🍅 '+t.donePomodoros+'/'+t.estimated;minus.onclick=function(e){e.stopPropagation();t.estimated=clamp(t.estimated-1,1,12);save();render()};plus.onclick=function(e){e.stopPropagation();t.estimated=clamp(t.estimated+1,1,12);save();render()};estimate.append(minus,count,plus);var remove=document.createElement('button');remove.className='delete';remove.textContent='×';remove.setAttribute('aria-label','删除任务');remove.onclick=function(e){e.stopPropagation();state.tasks=state.tasks.filter(function(x){return x.id!==t.id});if(state.activeTaskId===t.id)state.activeTaskId=state.tasks[0]?.id||null;save();render()};row.append(check,title,estimate,remove);row.onclick=function(){state.activeTaskId=t.id;render()};row.onkeydown=function(e){if(e.key==='Enter')row.click()};list.append(row)})}
    function sessionsFor(dateKey){return state.sessions.filter(function(s){return day(s.completedAt)===dateKey})}function sumSeconds(items,type){return items.reduce(function(total,s){return total+(type&&s.type!==type?0:s.durationSeconds)},0)}function renderStats(){var today=new Date().toLocaleDateString('en-CA'),items=sessionsFor(today),focus=items.filter(function(s){return s.type==='focus'});$('focusToday').textContent=humanTime(sumSeconds(focus));$('totalToday').textContent=humanTime(sumSeconds(items));$('todayCount').textContent=focus.length}
    function stop(){if(ticker)clearInterval(ticker);ticker=null;state.running=false;state.endsAt=0}function switchMode(mode){stop();state.mode=mode;state.seconds=duration(mode);render();syncFloating('jackyun-update-floating-window')}function toggle(){state.running?pause():start()}function start(){if(state.seconds<=0)state.seconds=duration(state.mode);if(state.settings.notificationsEnabled&&'Notification'in window&&Notification.permission==='default')Notification.requestPermission().catch(function(){});state.running=true;state.endsAt=Date.now()+state.seconds*1000;ticker=setInterval(tick,250);render();syncFloating('jackyun-open-floating-window')}function pause(){if(state.running)state.seconds=Math.max(0,Math.ceil((state.endsAt-Date.now())/1000));stop();render();syncFloating('jackyun-update-floating-window')}function reset(){stop();state.seconds=duration(state.mode);render();syncFloating('jackyun-close-floating-window')}function tick(){var left=Math.max(0,Math.ceil((state.endsAt-Date.now())/1000));if(left!==state.seconds){state.seconds=left;render();syncFloating('jackyun-update-floating-window')}if(left<=0)complete(false)}
    function complete(skipped){var completed=state.mode;stop();if(!skipped){var task=state.tasks.find(function(t){return t.id===state.activeTaskId}),record={id:id(),completedAt:new Date().toISOString(),durationSeconds:duration(completed),type:completed==='pomodoro'?'focus':'break',mode:completed,taskId:completed==='pomodoro'&&task?task.id:null,taskText:completed==='pomodoro'&&task?task.text:'',synced:false};state.sessions.push(record);saveHistorySession(record);if(completed==='pomodoro'){if(task)task.donePomodoros++;state.cycle++}save();tone();notify(completed==='pomodoro'?'专注完成，休息一下吧。':'休息结束，开始新的专注吧。');toast(completed==='pomodoro'?'这个番茄完成了，做得不错。':'休息结束，回来继续吧。')}state.mode=completed==='pomodoro'?(state.cycle>0&&state.cycle%state.settings.longBreakInterval===0?'long':'short'):'pomodoro';state.seconds=duration(state.mode);render();syncFloating('jackyun-close-floating-window')}
    function tone(){if(!state.settings.soundEnabled)return;try{var C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(660,c.currentTime);o.frequency.exponentialRampToValueAtTime(440,c.currentTime+.55);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.18,c.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.7);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.72)}catch(e){}}function notify(msg){if(state.settings.notificationsEnabled&&'Notification'in window&&Notification.permission==='granted')try{new Notification('番茄钟',{body:msg,icon:'/Webicon.png'})}catch(e){}}function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){$('toast').classList.remove('show')},3000)}
    function dateKey(year,month,date){return year+'-'+String(month+1).padStart(2,'0')+'-'+String(date).padStart(2,'0')}function openStats(){var now=new Date();selectedDate=now.toLocaleDateString('en-CA');calendarMonth=new Date(now.getFullYear(),now.getMonth(),1);renderCalendar();$('statsDialog').showModal()}function renderCalendar(){var year=calendarMonth.getFullYear(),month=calendarMonth.getMonth(),firstDay=(new Date(year,month,1).getDay()+6)%7,daysInMonth=new Date(year,month+1,0).getDate(),today=new Date().toLocaleDateString('en-CA'),grid=$('calendarGrid');$('calendarTitle').textContent=year+' 年 '+(month+1)+' 月';grid.replaceChildren();for(var blank=0;blank<firstDay;blank++){var spacer=document.createElement('span');spacer.className='calendar-blank';grid.appendChild(spacer)}for(var date=1;date<=daysInMonth;date++){(function(value){var key=dateKey(year,month,value),items=sessionsFor(key),focusCount=items.filter(function(s){return s.type==='focus'}).length,button=document.createElement('button');button.className='calendar-day'+(key===today?' today':'')+(key===selectedDate?' selected':'');button.innerHTML='<span>'+value+'</span><small>'+(focusCount?focusCount+' 🍅':'')+'</small>';button.setAttribute('aria-label',key+(focusCount?'，'+focusCount+' 个番茄':'，没有记录'));button.onclick=function(){selectedDate=key;renderCalendar()};grid.appendChild(button)})(date)}renderDayDetails();var recent=state.sessions.filter(function(s){return Date.now()-new Date(s.completedAt).getTime()<604800000}),focus=recent.filter(function(s){return s.type==='focus'});$('sevenFocus').textContent=humanTime(sumSeconds(focus));$('sevenTotal').textContent=humanTime(sumSeconds(recent));$('allPomodoros').textContent=state.sessions.filter(function(s){return s.type==='focus'}).length;$('allActiveDays').textContent=new Set(state.sessions.filter(function(s){return s.type==='focus'}).map(function(s){return day(s.completedAt)})).size}
    function renderDayDetails(){var items=sessionsFor(selectedDate).sort(function(a,b){return new Date(a.completedAt)-new Date(b.completedAt)}),focus=items.filter(function(s){return s.type==='focus'}),parts=selectedDate.split('-'),dateLabel=Number(parts[1])+' 月 '+Number(parts[2])+' 日',specs={};focus.forEach(function(s){var minutes=Math.round(s.durationSeconds/60);specs[minutes]=(specs[minutes]||0)+1});var specHtml=Object.keys(specs).sort(function(a,b){return Number(a)-Number(b)}).map(function(minutes){return'<span class="spec-chip">'+minutes+' 分钟 × '+specs[minutes]+'</span>'}).join('');var listHtml=items.map(function(s){var isFocus=s.type==='focus',clock=new Date(s.completedAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),label=isFocus?(s.taskText||'未指定任务'):(s.mode==='long'?'长休息':'短休息');return'<li class="session-item"><span class="session-icon">'+(isFocus?'🍅':'☕')+'</span><span class="session-copy"><strong>'+escapeHtml(label)+'</strong><small>'+clock+' · '+(isFocus?'专注':'休息')+'</small></span><span class="session-duration">'+humanTime(s.durationSeconds)+'</span></li>'}).join('');$('dayPanel').innerHTML='<div class="day-title">'+dateLabel+'</div><div class="day-subtitle">当天完成的计时记录</div><div class="day-metrics"><div class="day-metric"><strong>'+humanTime(sumSeconds(focus))+'</strong><span>纯学习</span></div><div class="day-metric"><strong>'+humanTime(sumSeconds(items))+'</strong><span>含休息</span></div><div class="day-metric"><strong>'+focus.length+'</strong><span>番茄数</span></div></div>'+(specHtml?'<div class="specs">'+specHtml+'</div>':'')+(listHtml?'<ul class="session-list">'+listHtml+'</ul>':'<div class="no-sessions">这一天还没有完成的计时记录</div>')}
    function syncSettings(){['pomodoroMin','shortBreakMin','longBreakMin','longBreakInterval'].forEach(function(k){$(k).value=state.settings[k]});['soundEnabled','notificationsEnabled'].forEach(function(k){$(k).classList.toggle('on',state.settings[k]);$(k).setAttribute('aria-checked',String(state.settings[k]))})}function numberSetting(k,min,max){state.settings[k]=clamp($(k).value,min,max);$(k).value=state.settings[k];if(!state.running&&((k==='pomodoroMin'&&state.mode==='pomodoro')||(k==='shortBreakMin'&&state.mode==='short')||(k==='longBreakMin'&&state.mode==='long')))state.seconds=duration(state.mode);save();render()}function applyPreset(preset,showMessage){stop();state.settings.pomodoroMin=preset==='deep'?50:25;state.settings.shortBreakMin=preset==='deep'?10:5;state.mode='pomodoro';state.seconds=duration('pomodoro');save();syncSettings();render();if(showMessage)toast(preset==='deep'?'已切换为 StudyGuide 深度节奏 50+10':'已切换为 StudyGuide 标准节奏 25+5')}
    document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){switchMode(b.dataset.mode)}});document.querySelectorAll('.preset').forEach(function(b){b.onclick=function(){applyPreset(b.dataset.preset,true)}});$('openStats').onclick=openStats;$('openStats').onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openStats()}};$('closeStats').onclick=function(){$('statsDialog').close()};$('statsDialog').onclick=function(e){if(e.target===$('statsDialog'))$('statsDialog').close()};$('prevMonth').onclick=function(){calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);renderCalendar()};$('nextMonth').onclick=function(){calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);renderCalendar()};$('start').onclick=toggle;$('reset').onclick=reset;$('skip').onclick=function(){complete(true)};$('taskForm').onsubmit=function(e){e.preventDefault();var input=$('taskInput'),text=input.value.trim();if(!text)return;var task={id:id(),text:text,estimated:1,completed:false,donePomodoros:0};state.tasks.unshift(task);state.activeTaskId=state.activeTaskId||task.id;input.value='';save();render()};$('openSettings').onclick=function(){syncSettings();$('settingsDialog').showModal()};$('closeSettings').onclick=function(){$('settingsDialog').close()};$('settingsDialog').onclick=function(e){if(e.target===$('settingsDialog'))$('settingsDialog').close()};[['pomodoroMin',10,90],['shortBreakMin',1,15],['longBreakMin',5,30],['longBreakInterval',2,8]].forEach(function(x){$(x[0]).onchange=function(){numberSetting(x[0],x[1],x[2])}});['soundEnabled','notificationsEnabled'].forEach(function(k){$(k).onclick=function(){state.settings[k]=!state.settings[k];syncSettings();save()}});document.onkeydown=function(e){if(e.target.matches('input')||$('settingsDialog').open||$('statsDialog').open)return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.key.toLowerCase()==='r')reset();if(e.key==='1')switchMode('pomodoro');if(e.key
