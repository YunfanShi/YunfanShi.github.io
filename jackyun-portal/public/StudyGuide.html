<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyGuide · JackYun</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="512x512" href="/Webicon.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/Webicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>

    <style>
        /* =========================================
           Google Material Design 3 主题
           ========================================= */
        :root {
            --md-primary: #1A73E8;
            --md-primary-container: #D2E3FC;
            --md-on-primary: #FFFFFF;
            --md-secondary: #5F6368;
            --md-surface: #FFFFFF;
            --md-surface-variant: #F8F9FA;
            --md-surface-dim: #E8EAED;
            --md-outline: #DADCE0;
            --md-outline-variant: #E8EAED;
            --md-on-surface: #202124;
            --md-on-surface-variant: #5F6368;
            --md-error: #D93025;
            --md-success: #1E8E3E;
            --md-warning: #F9AB00;
            
            --md-elevation-1: 0 1px 3px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.04);
            --md-elevation-2: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.06);
            --md-elevation-3: 0 2px 8px rgba(0,0,0,0.08), 0 6px 20px rgba(0,0,0,0.06);
            --md-elevation-4: 0 4px 16px rgba(0,0,0,0.08), 0 8px 32px rgba(0,0,0,0.06);
            
            --font-sans: 'Google Sans', 'Noto Sans SC', 'Inter', -apple-system, sans-serif;
            --font-mono: 'Google Sans Mono', 'SF Mono', monospace;
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 100px;
            
            --transition: cubic-bezier(0.4, 0, 0.2, 1);
            --transition-decelerated: cubic-bezier(0, 0, 0.2, 1);
            --transition-accelerated: cubic-bezier(0.4, 0, 1, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            background: var(--md-surface-variant);
            color: var(--md-on-surface);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* =========================================
           Layout
           ========================================= */
        .app-container {
            display: flex;
            min-height: 100vh;
        }

        .mobile-guide-bar,
        .mobile-guide-backdrop { display: none; }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--md-surface);
            border-right: 1px solid var(--md-outline-variant);
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            height: 100dvh;
            overflow-y: auto;
            z-index: 100;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            margin-bottom: 24px;
        }
        .sidebar-logo .logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--md-primary), #4285F4);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
        }
        .sidebar-logo .logo-text {
            font-size: 20px;
            font-weight: 600;
            color: var(--md-on-surface);
            letter-spacing: -0.3px;
        }
        .sidebar-logo .logo-badge {
            font-size: 11px;
            color: var(--md-secondary);
            margin-top: 2px;
        }

        .nav-section-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--md-secondary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 16px 16px 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 16px;
            border-radius: var(--radius-full);
            cursor: pointer;
            color: var(--md-on-surface-variant);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s var(--transition);
            text-decoration: none;
            user-select: none;
            position: relative;
        }
        .nav-item:hover {
            background: var(--md-surface-variant);
            color: var(--md-on-surface);
        }
        .nav-item.active {
            background: var(--md-primary-container);
            color: var(--md-primary);
        }
        .nav-item.active .nav-icon { color: var(--md-primary); }
        .nav-icon {
            font-size: 22px;
            color: var(--md-on-surface-variant);
            flex-shrink: 0;
        }
        .nav-item .material-icons-round {
            font-size: 22px;
        }
        .nav-check {
            margin-left: auto;
            width: 18px; height: 18px;
            border-radius: 50%;
            border: 2px solid var(--md-outline);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s var(--transition);
            flex-shrink: 0;
            font-size: 14px;
            color: transparent;
        }
        .nav-check.checked {
            background: var(--md-primary);
            border-color: var(--md-primary);
            color: white;
        }

        /* Main Content Area */
        .main-area {
            flex: 1;
            display: flex;
            min-width: 0;
            width: calc(100% - 280px);
            margin-left: 280px;
        }

        .content-scroll {
            flex: 1;
            padding: 40px 48px;
            overflow-y: auto;
            max-width: 900px;
        }

        /* AI Sidebar - currently hidden (主页 AI 已接管) */
        .ai-sidebar {
            display: none;
            width: 380px;
            background: var(--md-surface);
            border-left: 1px solid var(--md-outline-variant);
            flex-direction: column;
            height: 100vh;
            position: sticky;
            top: 0;
            flex-shrink: 0;
        }
        .ai-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--md-outline-variant);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .ai-avatar {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--md-primary), #4285F4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }
        .ai-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--md-on-surface);
        }
        .ai-subtitle {
            font-size: 12px;
            color: var(--md-secondary);
        }
        .ai-messages {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--md-surface-variant);
        }
        .ai-msg {
            max-width: 88%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .ai-msg.bot {
            background: var(--md-surface);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--md-outline-variant);
            color: var(--md-on-surface);
        }
        .ai-msg.user {
            background: var(--md-primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .ai-msg.system {
            background: #FFF8E1;
            color: #795548;
            border: 1px solid #FFE082;
            border-radius: var(--radius-md);
            text-align: center;
            font-size: 12px;
            width: 100%;
            max-width: 100%;
        }
        .ai-input-area {
            padding: 16px 20px 20px;
            border-top: 1px solid var(--md-outline-variant);
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        .ai-input {
            flex: 1;
            border: 1px solid var(--md-outline);
            border-radius: var(--radius-full);
            padding: 10px 18px;
            font-size: 14px;
            font-family: var(--font-sans);
            background: var(--md-surface);
            color: var(--md-on-surface);
            outline: none;
            resize: none;
            max-height: 100px;
            line-height: 1.5;
            transition: border-color 0.2s var(--transition);
        }
        .ai-input:focus {
            border-color: var(--md-primary);
            box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.15);
        }
        .ai-send-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: var(--md-primary);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s var(--transition);
        }
        .ai-send-btn:hover { background: #1557B0; transform: scale(1.05); }
        .ai-send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .ai-status {
            font-size: 11px;
            color: var(--md-secondary);
            text-align: center;
            padding: 4px 16px 0;
            min-height: 20px;
        }

        /* =========================================
           Page Header
           ========================================= */
        .page-header {
            margin-bottom: 32px;
        }
        .page-header h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--md-on-surface);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .page-header .header-icon {
            font-size: 32px;
            color: var(--md-primary);
        }
        .page-header p {
            font-size: 15px;
            color: var(--md-on-surface-variant);
            margin-top: 8px;
            line-height: 1.6;
        }

        /* =========================================
           Tab System
           ========================================= */
        .tabs-container {
            margin-bottom: 32px;
        }

        .main-tabs {
            display: flex;
            gap: 4px;
            background: var(--md-surface-dim);
            border-radius: var(--radius-full);
            padding: 4px;
            position: relative;
        }
        .main-tab {
            flex: 1;
            padding: 10px 20px;
            border-radius: var(--radius-full);
            border: none;
            background: transparent;
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 500;
            color: var(--md-on-surface-variant);
            cursor: pointer;
            transition: all 0.3s var(--transition);
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }
        .main-tab:hover { color: var(--md-on-surface); }
        .main-tab.active {
            background: var(--md-surface);
            color: var(--md-primary);
            box-shadow: var(--md-elevation-1);
        }
        .main-tab .tab-icon {
            font-size: 20px;
        }
        .main-tab .tab-badge {
            font-size: 10px;
            background: var(--md-primary-container);
            color: var(--md-primary);
            padding: 1px 8px;
            border-radius: var(--radius-full);
            margin-left: 4px;
        }

        /* Sub-tabs (for 学习) */
        .sub-tabs {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            padding: 0 4px;
        }
        .sub-tab {
            padding: 8px 20px;
            border-radius: var(--radius-full);
            border: 1px solid var(--md-outline);
            background: transparent;
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 500;
            color: var(--md-on-surface-variant);
            cursor: pointer;
            transition: all 0.2s var(--transition);
        }
        .sub-tab:hover {
            background: var(--md-surface-variant);
            border-color: var(--md-secondary);
        }
        .sub-tab.active {
            background: var(--md-primary-container);
            border-color: var(--md-primary);
            color: var(--md-primary);
        }

        /* Time granule pills */
        .time-pills {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        .time-pill {
            padding: 6px 16px;
            border-radius: var(--radius-full);
            border: 1px solid var(--md-outline);
            background: transparent;
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 500;
            color: var(--md-on-surface-variant);
            cursor: pointer;
            transition: all 0.2s var(--transition);
        }
        .time-pill:hover { border-color: var(--md-primary); color: var(--md-primary); }
        .time-pill.active {
            background: var(--md-primary);
            border-color: var(--md-primary);
            color: white;
        }

        /* =========================================
           Content Cards
           ========================================= */
        .content-panel {
            animation: fadeInUp 0.35s var(--transition-decelerated);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .method-card {
            background: var(--md-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--md-outline-variant);
            padding: 24px;
            margin-bottom: 16px;
            transition: all 0.2s var(--transition);
            box-shadow: var(--md-elevation-1);
        }
        .method-card:hover {
            box-shadow: var(--md-elevation-2);
        }

        .method-card-header {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            cursor: pointer;
        }
        .method-card-icon {
            width: 44px; height: 44px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .method-card-icon.blue { background: #E8F0FE; color: var(--md-primary); }
        .method-card-icon.green { background: #E6F4EA; color: var(--md-success); }
        .method-card-icon.orange { background: #FEF7E0; color: var(--md-warning); }
        .method-card-icon.red { background: #FCE8E6; color: var(--md-error); }
        .method-card-icon.purple { background: #F3E8FD; color: #9334E6; }

        .method-card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--md-on-surface);
            margin-bottom: 4px;
        }
        .method-card-subtitle {
            font-size: 13px;
            color: var(--md-on-surface-variant);
            line-height: 1.5;
        }
        .method-card-expand {
            margin-left: auto;
            color: var(--md-outline);
            transition: transform 0.3s var(--transition);
        }
        .method-card.expanded .method-card-expand {
            transform: rotate(180deg);
        }

        .method-card-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s var(--transition-decelerated), opacity 0.25s var(--transition);
            opacity: 0;
        }
        .method-card.expanded .method-card-body {
            max-height: 2000px;
            opacity: 1;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--md-outline-variant);
        }

        .method-step {
            display: flex;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--md-surface-dim);
        }
        .method-step:last-child { border-bottom: none; }
        .method-step-num {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--md-primary-container);
            color: var(--md-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .method-step-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--md-on-surface);
            margin-bottom: 4px;
        }
        .method-step-desc {
            font-size: 13px;
            color: var(--md-on-surface-variant);
            line-height: 1.6;
        }
        .method-step-desc code {
            background: var(--md-surface-variant);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-family: var(--font-mono);
        }
        .more-details {
            margin-top: 10px;
            border: 1px solid var(--md-outline-variant);
            border-radius: var(--radius-md);
            background: var(--md-surface-container-low);
            overflow: hidden;
        }
        .more-details summary {
            cursor: pointer;
            padding: 9px 12px;
            color: var(--md-primary);
            font-size: 13px;
            font-weight: 600;
            list-style: none;
        }
        .more-details summary::-webkit-details-marker { display: none; }
        .more-details summary::after {
            content: '＋';
            float: right;
            color: var(--md-outline);
        }
        .more-details[open] summary::after { content: '－'; }
        .more-details-body {
            padding: 0 12px 12px;
            color: var(--md-on-surface-variant);
            font-size: 13px;
            line-height: 1.7;
        }
        .more-details-body b { color: var(--md-on-surface); }
        .more-details-body p { margin: 7px 0 0; }

        /* Checklist inside card */
        .checklist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            cursor: pointer;
        }
        .checklist-checkbox {
            width: 22px; height: 22px;
            border-radius: 50%;
            border: 2px solid var(--md-outline);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s var(--transition);
            font-size: 16px;
            color: transparent;
        }
        .checklist-checkbox.checked {
            background: var(--md-primary);
            border-color: var(--md-primary);
            color: white;
        }
        .checklist-label {
            font-size: 14px;
            color: var(--md-on-surface);
            flex: 1;
        }
        .checklist-label.done {
            text-decoration: line-through;
            color: var(--md-on-surface-variant);
        }

        /* =========================================
           Time Timeline (今日板块专用)
           ========================================= */
        .timeline {
            position: relative;
            padding-left: 32px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 11px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--md-outline-variant);
        }
        .timeline-item {
            position: relative;
            padding-bottom: 20px;
        }
        .timeline-dot {
            position: absolute;
            left: -24px;
            top: 4px;
            width: 12px; height: 12px;
            border-radius: 50%;
            background: var(--md-primary);
            border: 3px solid var(--md-primary-container);
        }
        .timeline-time {
            font-size: 12px;
            font-weight: 600;
            color: var(--md-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .timeline-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--md-on-surface);
            margin-bottom: 4px;
        }
        .timeline-desc {
            font-size: 13px;
            color: var(--md-on-surface-variant);
            line-height: 1.5;
        }
        .timeline-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .method-link {
            border: 1px solid var(--md-outline-variant);
            border-radius: 999px;
            background: var(--md-surface);
            color: var(--md-primary);
            padding: 7px 11px;
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .method-link:hover { background: var(--md-primary-container); }
        .period-setting {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0 16px;
            color: var(--md-on-surface-variant);
            font-size: 13px;
        }
        .period-setting select {
            border: 1px solid var(--md-outline-variant);
            border-radius: 8px;
            background: var(--md-surface);
            color: var(--md-on-surface);
            padding: 7px 10px;
        }
        .exam-plan-form {
            display: grid;
            grid-template-columns: minmax(140px, 1.5fr) minmax(130px, 1fr) minmax(130px, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
        .exam-plan-form input,
        .exam-plan-form select,
        .exam-plan-form textarea {
            min-width: 0;
            border: 1px solid var(--md-outline-variant);
            border-radius: 8px;
            background: var(--md-surface);
            color: var(--md-on-surface);
            padding: 8px 10px;
            font: inherit;
            resize: vertical;
        }
        .exam-plan-form .full { grid-column: 1 / -1; }
        .tool-card {
            margin: 16px 0;
            padding: 18px;
            border: 1px solid var(--md-outline-variant);
            border-radius: var(--radius-lg);
            background: var(--md-surface);
        }
        .tool-card h3 { margin: 0 0 6px; font-size: 16px; }
        .tool-card > p { margin: 0 0 14px; color: var(--md-on-surface-variant); font-size: 13px; line-height: 1.55; }
        .tool-form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }
        .tool-form .full { grid-column: 1 / -1; }
        .tool-field { display: grid; gap: 5px; color: var(--md-on-surface-variant); font-size: 12px; }
        .tool-field input,
        .tool-field select,
        .tool-field textarea {
            width: 100%;
            border: 1px solid var(--md-outline-variant);
            border-radius: 8px;
            background: var(--md-surface);
            color: var(--md-on-surface);
            padding: 9px 10px;
            font: inherit;
            resize: vertical;
        }
        .tool-output {
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
            font-size: 13px;

    const STUDY_DATA = {
        learn: {

            subTabs: ['preview', 'cornell', 'review', 'traffic', 'selfstudy'],
            subTabLabels: { preview: '4-P 预习', cornell: 'Cornell 学习', review: '主动回忆与间隔', traffic: 'Syllabus 红绿灯', selfstudy: '50分钟自学' },
            content: {
                preview: methodPage('4-P 预习：带着问题进课堂', 'visibility', '预习不是提前学完整章，而是建立地图、激活旧知识并生成1–3个问题。', '上新课前5–10分钟；时间不足时放到前一晚或当天第一个空档。', '能说出这节课大概解决什么，并留下1–3个课堂要验证的问题。', [
                    step('①', 'Preview · 扫结构', '看标题、小标题、图表、例题和结论，只判断内容结构。', '<b>怎么做：</b>快速翻页，不逐句阅读。用一句话写“这一节大概在解释什么”。<p><b>例子：</b>看到“缓存、命中率、层级结构”，先判断本节在解释计算机为什么需要不同速度的存储层。</p>'),

                writing: methodPage('Writing：旧文修复 + 新文迁移', 'edit_note', '旧作文负责暴露和修复真实问题；新作文负责证明这些错误是否真正减少。', 'Task 1 / Task 2写作、旧作文修改、AI批改后复盘时。', '当前作文的主要问题收敛，并在新的独立作文中减少同类错误、主动使用部分新表达。', [
                    step('①', 'Original Attempt · 自己先写', '先独立完成真实输出，不让AI预先生成答案或高分范文。', '<b>原稿必须保留你的真实能力。</b>否则AI无法判断哪些grammar、logic或task response问题是你自己会重复犯的。'),

    function renderExpandedDetails(title, directDetail) {
        const content = directDetail || EXPANDED_DETAILS[title];

    /* =========================================
       STATE
       ========================================= */
    const STATE = {
        mainTab: 'today',
        subTab: null,
        dashboardPeriod: 'daily',
        moduleGranule: 'daily',
        activeExamPlan: null,
        weeklyReviewDay: 'flexible',
        progress: {},
        aiMessages: [],
        aiLoading: false,
        stuckHint: { known: '', stuck: '', history: [], loading: false }
    };

    // Load from localStorage
    function loadState() {
        try {
            const saved = JSON.parse(localStorage.getItem('studyguide_progress') || '{}');
            STATE.progress = saved.checklists || {};
            STATE.mainTab = saved.lastTab || 'today';
            STATE.dashboardPeriod = saved.dashboardPeriod || 'daily';
            STATE.moduleGranule = saved.moduleGranule || saved.lastGranule || 'daily';
            STATE.activeExamPlan = saved.activeExamPlan || null;
            STATE.weeklyReviewDay = saved.weeklyReviewDay || 'flexible';
        } catch(e) { /* ignore */ }
    }

    function saveState() {
        try {
            localStorage.setItem('studyguide_progress', JSON.stringify({
                checklists: STATE.progress,
                lastTab: STATE.mainTab,
                dashboardPeriod: STATE.dashboardPeriod,
                moduleGranule: STATE.moduleGranule,
                activeExamPlan: STATE.activeExamPlan,
                weeklyReviewDay: STATE.weeklyReviewDay
            }));
        } catch(e) { /* ignore */ }
    }

    /* =========================================
       TODAY DETECTION
       ========================================= */
    function getTodayInfo() {
        const now = new Date();
        const day = now.getDay(); // 0=Sunday, 1-5=weekday, 6=Saturday
        const isWeekend = day === 0 || day === 6;
        return { day, isWeekend, now };
    }

    /* =========================================
       RENDER ENGINE
       ========================================= */
    function switchMainTab(tab) {
        STATE.mainTab = tab;
        STATE.subTab = null;
        
        // Update nav
        document.querySelectorAll('.nav-item').forEach(el => {
            el.classList.toggle('active', el.dataset.tab === tab);
        });

        // Set default sub-tab
        if (tab === 'learn') STATE.subTab = 'preview';
        if (tab === 'workflow') STATE.subTab = 'loop';
        if (tab === 'practice') STATE.subTab = 'general';
        if (tab === 'exam') STATE.subTab = 'school';
        if (tab === 'procrastination') STATE.subTab = 'plan';
        if (tab === 'ielts') STATE.subTab = 'overview';

        render();
        saveState();
        toggleGuideNav(false);
    }

    function toggleGuideNav(open) {
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.querySelector('.mobile-guide-backdrop');
        const trigger = document.querySelector('.mobile-guide-menu');
        if (!sidebar || !backdrop || !trigger) return;
        sidebar.classList.toggle('mobile-open', open);
        backdrop.classList.toggle('mobile-open', open);
        document.body.classList.toggle('guide-nav-open', open);
        trigger.setAttribute('aria-expanded', String(open));
    }

    function switchSubTab(subTab) {
        STATE.subTab = subTab;
        saveState();
        render();
    }

    function switchTimeGranule(granule) {
        STATE.moduleGranule = granule;
        saveState();
        render();
    }

    function switchDashboardPeriod(period) {
        if (!['daily', 'weekly', 'biweekly'].includes(period)) return;
        STATE.dashboardPeriod = period;
        saveState();
        render();
    }

    function setWeeklyReviewDay(day) {
        STATE.weeklyReviewDay = day;
        saveState();
        render();
    }

    function navigateToMethod(tab, subTab) {
        switchMainTab(tab);
        if (subTab && STUDY_DATA[tab]?.content?.[subTab]) {
            STATE.subTab = subTab;
            const granules = STUDY_DATA[tab].content[subTab].granules || {};
            STATE.moduleGranule = Object.keys(granules)[0] || 'daily';
            saveState();
            render();
        }
    }

    function launchPomodoroPreset(preset) {
        if (preset !== 'standard' && preset !== 'deep') return;
        localStorage.setItem('pomodoro_launch_preset', preset);
        const destination = window.top.location.protocol === 'file:' ? 'Pomodoro.html' : '/pomodoro';
        window.top.location.href = destination;
    }

    function render() {
        const area = document.getElementById('contentArea');

        document.querySelectorAll('.nav-item[data-tab]').forEach(el => {
            el.classList.toggle('active', el.dataset.tab === STATE.mainTab);
        });
        
        if (STATE.mainTab === 'today') {
            area.innerHTML = renderToday();
        } else {
            area.innerHTML = renderModule(STATE.mainTab);
        }

        // Update checkmarks
        updateNavChecks();
    }

       RENDER: 执行中心
       ========================================= */
    function renderToday() {
        const info = getTodayInfo();
        const dateStr = info.now.toLocaleDateString('zh-CN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        const period = ['daily', 'weekly', 'biweekly'].includes(STATE.dashboardPeriod) ? STATE.dashboardPeriod : 'daily';
        const periodKey = getDashboardProgressKey(period, info.now);

        const items = getTimelineItems(period);

        const periodLabels = { daily: '今日', weekly: '本周', biweekly: '每两周' };

            daily: '按真实上学日推进：课前预习、课中记录、课后加工、作业应用、到期复习。',

                <h1>
                    <span class="material-icons-round header-icon">dashboard</span>

            <div class="time-pills">
                <button class="time-pill ${period === 'daily' ? 'active' : ''}" onclick="switchDashboardPeriod('daily')">今日</button>
                <button class="time-pill ${period === 'weekly' ? 'active' : ''}" onclick="switchDashboardPeriod('weekly')">本周</button>
                <button class="time-pill ${period === 'biweekly' ? 'active' : ''}" onclick="switchDashboardPeriod('biweekly')">每两周</button>
            </div>

                <span class="material-icons-round">${period === 'daily' ? 'school' : period === 'weekly' ? 'manage_search' : 'history'}</span>
                <div><strong>${periodLabels[period]}的职责</strong>${periodDescriptions[period]}${period === 'daily' ? '<br>今天课表里的科目都走轻量流程；只有额外时间才集中补1–2个薄弱科目。' : ''}</div>
            </div>

            <div class="content-panel">

        const options = [

            ['4', '周四'], ['5', '周五'], ['6', '周六'], ['0', '周日']

    function toggleDashboardCheck(progressKey, checkKey, period) {
        if (!STATE.progress[progressKey]) STATE.progress[progressKey] = {};
        STATE.progress[progressKey][checkKey] = !STATE.progress[progressKey][checkKey];
        if (period === 'biweekly') {
            const items = getTimelineItems('biweekly');
            const complete = items.every(item => STATE.progress[progressKey][item.checkKey]);
            if (complete) {
                localStorage.setItem('studyguide_last_retention_review', formatDateKey(new Date()));
                localStorage.setItem('studyguide_last_retention_progress_key', progressKey);
                localStorage.removeItem('studyguide_open_retention_cycle');
            }
        }
        saveState();
        render();
    }

    function formatDateKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    }

    function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, char => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        })[char]);
    }

    function getISOWeekKey(date) {
        const utc = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
        const weekday = utc.getUTCDay() || 7;
        utc.setUTCDate(utc.getUTCDate() + 4 - weekday);
        const yearStart = new Date(Date.UTC(utc.getUTCFullYear(), 0, 1));
        const week = Math.ceil((((utc - yearStart) / 86400000) + 1) / 7);
        return `week:${utc.getUTCFullYear()}-W${String(week).padStart(2, '0')}`;
    }

    function getRetentionCycleKey(date) {
        const lastCompleted = localStorage.getItem('studyguide_last_retention_review');
        const lastProgressKey = localStorage.getItem('studyguide_last_retention_progress_key');
        if (lastCompleted) {
            const lastDate = new Date(`${lastCompleted}T00:00:00`);
            if (!Number.isNaN(lastDate.getTime())) {
                const elapsedDays = Math.floor((date.getTime() - lastDate.getTime()) / 86400000);
                if (elapsedDays < 14) return lastProgressKey || `retention:${lastCompleted}`;
            }
        }
        let openCycle = localStorage.getItem('studyguide_open_retention_cycle');
        if (!openCycle) {
            openCycle = formatDateKey(date);
            localStorage.setItem('studyguide_open_retention_cycle', openCycle);
        }
        return `retention:${openCycle}`;
    }

    function getDashboardProgressKey(period, date) {
        if (period === 'weekly') return getISOWeekKey(date);
        if (period === 'biweekly') return getRetentionCycleKey(date);
        return `day:${formatDateKey(date)}`;
    }

        // Get time granules available for this sub content
        const granules = subContent?.granules || {};
        const granuleKeys = Object.keys(granules);
        const activeGranule = granuleKeys.includes(STATE.moduleGranule) ? STATE.moduleGranule : (granuleKeys[0] || 'daily');

        return `
            <div class="page-header">
                <h1>
                    <span class="material-icons-round header-icon">${module.icon}</span>

    function buildTaskDraft(subject, action, scope, standard = '') {
        if (!subject || !action || !scope) return null;
        return {
            title: `${String(action).trim()} ${String(subject).trim()} — ${String(scope).trim()}`,
            description: standard ? `完成标准：${String(standard).trim()}` : ''

    async function copyTaskDraft() {
        if (!STATE.taskDraft) return;
        const text = [STATE.taskDraft.title, STATE.taskDraft.description].filter(Boolean).join('\n');

    function renderStuckHintTool() {
        const hint = STATE.stuckHint;
        const latest = hint.history[hint.history.length - 1] || '';
        return `<section class="tool-card" aria-labelledby="stuckHintTitle">
            <h3 id="stuckHintTitle">卡题提示器</h3>
            <p>默认只给当前最小提示，不直接把答案或完整步骤揭出来。能继续以后就回题目。</p>
            <div class="tool-form">
                <label class="tool-field full">我已经做到哪里<textarea id="hintKnown" rows="3" placeholder="例如：我已经列出两个变量，也知道最终要比较变化率">${escapeHtml(hint.known)}</textarea></label>
                <label class="tool-field full">我具体卡在哪里<textarea id="hintStuck" rows="3" placeholder="例如：不知道该用总量还是变化率继续">${escapeHtml(hint.stuck)}</textarea></label>
            </div>
            <div class="timeline-actions">
                <button class="method-link" onclick="requestStuckHint(false)" ${hint.loading ? 'disabled' : ''}>${hint.loading ? '正在判断…' : '给我最小提示'}</button>
                ${latest ? `<button class="method-link" onclick="requestStuckHint(true)" ${hint.loading ? 'disabled' : ''}>再给一点提示</button>` : ''}
            </div>

    async function requestStuckHint(more) {
        const known = more ? STATE.stuckHint.known : document.getElementById('hintKnown')?.value.trim();
        const stuck = more ? STATE.stuckHint.stuck : document.getElementById('hintStuck')?.value.trim();
        if (!known || !stuck) {
            showSimpleModal('先写清具体卡点', '请分别写“我已经做到哪里”和“我具体卡在哪里”。');
            return;
        }
        const cfg = JSON.parse(localStorage.getItem('jackyun-ai-config') || '{}');
        if (!cfg.apiKey) {
            showSimpleModal('需要先配置AI', '请先在Jackyun Portal设置页面配置AI API Key。');
            return;
        }
        STATE.stuckHint.known = known;
        STATE.stuckHint.stuck = stuck;
        STATE.stuckHint.loading = true;
        render();
        const level = STATE.stuckHint.history.length + 1;
        const previous = STATE.stuckHint.history.map((text, index) => `提示${index + 1}：${text}`).join('\n');
        const prompt = `学生已经做到：${known}\n学生卡在：${stuck}\n${previous ? `之前已经给过：\n${previous}\n` : ''}现在给第${level}层提示。不要给最终答案，不要完整解题，只给一个足以继续的最小提示。顺序优先：相关条件 → 方法类别 → 中间方向 → 最后才是关键步骤。如果信息不足，只问一个最必要的问题。回复不超过80字。`;
        try {
            const res = await fetch('/api/llm-proxy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    baseUrl: cfg.baseUrl,
                    apiKey: cfg.apiKey,
                    model: cfg.model || 'deepseek-chat',
                    messages: [
                        { role: 'system', content: '你是卡题提示器。严格遵守最小提示原则；除非用户明确要求完整答案，否则绝不一次给出完整解法。' },
                        { role: 'user', content: prompt }
                    ]
                })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            const answer = data.choices?.[0]?.message?.content || data.content || data.response || '暂时没有生成提示，请稍后再试。';
            STATE.stuckHint.history.push(answer);
        } catch (error) {
            STATE.stuckHint.history.push('提示暂时无法生成。请先回题目圈出目标、已有信息和最具体的缺口，再向老师或同学只问下一步。');
        } finally {
            STATE.stuckHint.loading = false;
            render();
        }
    }

    function startExamPlan() {
        const name = document.getElementById('examPlanName')?.value.trim() || '当前考试';
        const date = document.getElementById('examPlanDate')?.value || '';
        const examType = document.getElementById('examPlanType')?.value || 'school';
        const scope = document.getElementById('examPlanScope')?.value.trim() || '';
        if (!date) {
            showSimpleModal('请先选择考试日期', '有了日期，系统才能计算剩余时间并给出阶段建议。');
            return;
        }
        STATE.activeExamPlan = { name, date, examType, scope, startedAt: formatDateKey(new Date()) };
        saveState();
        render();
    }

    function getExamPlanAdvice(plan, now = new Date()) {
        const noDate = {
            daysLeft: null,
            current: '补充考试日期后，系统会按剩余时间给建议',
            later: 'Map → Diagnose → Repair → Verify → Simulate → Stabilize',
            note: '这些阶段是参考，不是固定时间比例。'
        };
        if (!plan?.date) return noDate;
        const examDate = new Date(`${plan.date}T00:00:00`);
        if (Number.isNaN(examDate.getTime())) return noDate;
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const daysLeft = Math.ceil((examDate.getTime() - today.getTime()) / 86400000);
        const baseNote = '正常课程和休息继续保留；阶段长度由你的范围、证据和学校安排决定。';
        if (daysLeft < 0) return { daysLeft, current: '考试日期已过', later: '结束当前计划，或用新的日期重建', note: '以前保存的计划不会影响页面。' };
        if (daysLeft <= 1) return {
            daysLeft,
            current: `剩余${daysLeft}天 · 快速Map + Diagnose → 修最关键漏洞 → Quick Verify`,
            later: '停止扩展新内容，检查Remaining Risks、考试规则和物品，然后保证正常休息',
            note: baseNote
        };
        if (daysLeft <= 7) return {
            daysLeft,
            current: `剩余${daysLeft}天 · 快速Map / Diagnose，把大部分时间留给Repair / Verify`,
            later: '最后加入少量mixed或timed practice，再进入Stabilize',
            note: baseNote
        };
        if (daysLeft <= 21) return {
            daysLeft,
            current: `剩余${daysLeft}天 · Map & Diagnose → Repair & Verify`,
            later: '临近考试逐渐加入Simulate，并在最后阶段Stabilize',
            note: baseNote
        };
        if (daysLeft <= 120) return {
            daysLeft,
            current: `剩余${daysLeft}天 · 建立完整范围地图，持续Repair和topic practice`,
            later: '中期转向cross-topic / sections，后期再逐渐增加full papers与mock',
            note: baseNote
        };
        return {
            daysLeft,
            current: `剩余${daysLeft}天 · 以长期学习、Syllabus Coverage和topic practice为主`,
            later: '定期Diagnose / Verify；接近考试后才提高sections、full papers和mock比例',
            note: '不要过早进入整卷刷题模式。' + baseNote
        };
    }

                        ` : `
                            <div class="method-step-desc">${sec.details || sec.desc || ''}</div>
                            ${renderExpandedDetails(sec.title, sec.detail)}
                        `}
                        
                        <div class="checklist-item mt-4" role="button" tabindex="0" aria-label="标记此项完成" onclick="toggleModuleCheck('${progressKey}_${si}', 'done')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleModuleCheck('${progressKey}_${si}', 'done')}" >
                            <div class="checklist-checkbox ${(STATE.progress[progressKey + '_' + si] || {}).done ? 'checked' : ''}">
                                <span class="material-icons-round" style="font-size: 16px;">${(STATE.progress[progressKey + '_' + si] || {}).done ? 'check' : ''}</span>
                            </div>
                            <div class="checklist-label ${(STATE.progress[progressKey + '_' + si] || {}).done ? 'done' : ''}">
                                ${(STATE.progress[progressKey + '_' + si] || {}).done ? '已完成 ✓' : '标记为已完成'}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        return '';
    }

    function toggleModuleCheck(key, field) {
        if (!STATE.progress[key]) STATE.progress[key] = {};
        STATE.progress[key][field] = !STATE.progress[key][field];
        saveState();
        updateNavChecks();
        
        // Re-render only the checkmarks
        const area = document.getElementById('contentArea');
        if (STATE.mainTab === 'today') {
            render();
        } else {
            render();
        }
    }

    /* =========================================
       NAV CHECKS
       ========================================= */
    function updateNavChecks() {
        // Count progress for each tab
        const tabs = ['today', 'learn', 'practice', 'exam', 'workflow', 'procrastination', 'ielts'];
        tabs.forEach(tab => {
            const check = document.getElementById(`check-${tab}`);
            if (!check) return;
            
            // Simple heuristic: if any progress exists for this tab
            let hasProgress = false;
            if (tab === 'today') {
                const dashboardKeys = [
                    getDashboardProgressKey('daily', new Date()),
                    getDashboardProgressKey('weekly', new Date()),
                    getDashboardProgressKey('biweekly', new Date())
                ];
                hasProgress = dashboardKeys.some(key => Object.values(STATE.progress[key] || {}).some(Boolean));
            } else {
                const validPrefixes = (STUDY_DATA[tab]?.subTabs || []).map(subTab => `${tab}_${subTab}_`);
                hasProgress = Object.entries(STATE.progress).some(([key, value]) =>
                    validPrefixes.some(prefix => key.startsWith(prefix)) && Object.values(value || {}).some(Boolean)
                );
            }
            
            check.classList.toggle('checked', hasProgress);
        });
    }

    function showSimpleModal(titleText, message) {
        const overlay = document.getElementById('modalOverlay');
        document.getElementById('modalTitle').textContent = titleText;
        document.getElementById('modalDesc').textContent = message;
        document.getElementById('modalActions').innerHTML = '<button class="modal-btn primary" onclick="closeModal()">知道了</button>';
        overlay.classList.add('show');
    }

    function closeModal(e) {
        if (e && e.target !== document.getElementById('modalOverlay') && !e.target.closest('.modal-overlay')) return;
        document.getElementById('modalOverlay').classList.remove('show');
    }

    /* =========================================
       AI CHAT
       ========================================= */
    async function sendAiMessage() {
        const input = document.getElementById('aiInput');
        const text = input.value.trim();
        if (!text || STATE.aiLoading) return;

        input.value = '';
        autoResize(input);

        // Add user message
        addAiMessage(text, 'user');
        STATE.aiMessages.push({ role: 'user', content: text });

        // Show loading
        const loadingId = addAiLoading();
        STATE.aiLoading = true;
        document.getElementById('aiStatus').textContent = '思考中...';
        document.getElementById('aiSendBtn').disabled = true;

        try {
            // Read AI config from localStorage (same as other pages)
            const cfg = JSON.parse(localStorage.getItem('jackyun-ai-config') || '{}');
            if (!cfg.apiKey) throw new Error('请先在 Jackyun Portal 的设置页面配置 AI API Key');

            const systemPrompt = `你是 JackYun Portal StudyGuide 的学习指导导师。你的目标不是一次推荐很多方法，而是先定位问题，再给一条可执行路径。

网站信息架构：
- 执行中心只回答 What / When：今日学校流程、本周诊断、每两周留存审计，以及当前考试叠加计划。
- 学习回答 How：4-P预习、Cornell、主动回忆与间隔、Syllabus红绿灯、可选50分钟自学。
- 习题是按需工具：难题怎么拆、学科/题型怎么做、错题诊断、卡题怎么办。普通熟悉题直接做；难题拆解的核心是“目标 → 缺口 → 连接”。
- IELTS专项回答IELTS的How：总览、Listening、Reading、Writing、Speaking、词汇与语法。核心是Correction → Transfer，不负责日程、打卡、题库或考试计划。
- 考试包含学校考试、大型考试管理、日期驱动的阶段建议和简洁考场策略。考试计划根据真实日期建议Map、Diagnose、Repair、Verify、Simulate、Stabilize，不使用固定2周/3周模板，也不替代日常学习。
- 学习闭环位于考试下面，只解释理解 → 连接 → 检索 → 应用，以及失败时应去哪个模块；不包含学校日、自学、复习或卡题子页。
- 执行与专注处理计划、启动、环境和注意力。计划写到“可以直接开始”即可，默认动作 + 范围，只有完成含义不清时才补完成标准。
- TickTick等任务管理器负责What、When、Scope、Deadline、Priority和时间安排；StudyGuide负责How、诊断与修复。不要把任务标题写成方法说明书。

回答顺序：
1. 先确认学科、具体主题，以及任务类型或指令词（计算、Explain、Compare、Evaluate、材料分析、实验、Trace、Pseudocode等）。信息足够时不要重复追问。
2. 判断主要卡点：学习理解、检索记忆、题型选择、推理执行、考试策略，还是启动专注。
3. 只推荐最相关的一个主板块和一个具体页面，给出“现在做什么”和“做到什么算完成”。必要时再给一个后续去向。
4. 不把Cornell、费曼、知识树、Anki、番茄钟并列成必须全部执行的方法。它们只是按需工具；Anki和番茄钟始终是可选的。
5. 用户卡题时，默认只给当前最小提示：先提示条件，再提示方法类别，再提示中间方向，最后才是关键步骤。一旦用户能继续就停止；除非用户明确要求完整答案，否则不直接完整解题。

IELTS路由与规则：
- 用户问IELTS Listening错题，优先路由到“IELTS专项 → Listening”，而不是泛化的错题诊断。Test Mode禁止暂停/回拨；Repair Mode才局部重听，并按原因做最小修复。
- Reading同时诊断Wrong和Correct but Slow；要求回原文确认Evidence与paraphrase，再用新题验证。
- Writing默认AI找问题和原因 → 用户自己修改 → AI再检查；主要错误收敛后才做Language Upgrade，最终用New Essay Transfer。不要一开始重写整篇。
- Writing的This Essay Errors只记录本篇真实错误；同一问题至少在2篇独立新作文重复出现，才成为Recurring Error。
- Speaking允许同题重复修正，每轮集中1–2个主要问题；同题练顺后必须换新题，不鼓励背完整机经答案。
- Vocabulary / Grammar来自四项真实问题；区分Recognition与Active Vocabulary，并通过新输出检查Grammar Automaticity。

统一定义：
- √＝本次闭卷检索独立、准确、完整；△＝有印象但遗漏或需轻提示；○＝无法独立回忆或看答案才想起。
- Syllabus红绿灯是主题范围的长期掌握状态，与单次检索√/△/○不同。
- 错题三个必填项是Knowledge Node、Root Cause、Retest。根因九类：Knowledge、Recall、Condition/Rule、Interpretation、Selection、Reasoning、Execution、Response Structure、Time/Strategy。
- 间隔1/3/5/7/14天只是起始参考，下一次日期由实际表现决定。

表达要求：
- 优先中文，短而清楚；先直接说下一步，必要时再补简短原因、例子或完成判断，不强制固定格式。
- 例子必须适配用户的学科和题型，不默认所有问题都是计算或公式题。
- 若用户临近考试，先看考试日期和范围：剩1天、1周、2–3周、2–4个月或更久，阶段侧重点不同；所有建议都不是死规则。
- 不虚构固定题量、固定套卷频率、任意时间比例或必须一坐一天的学习安排。`;

            const res = await fetch('/api/llm-proxy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    baseUrl: cfg.baseUrl,
                    apiKey: cfg.apiKey,
                    model: cfg.model || 'deepseek-chat',
                    messages: [
                        { role: 'system', content: systemPrompt },
                        ...STATE.aiMessages.slice(-10)
                    ],
                    stream: false,
                    max_tokens: 2000,
                    temperature: 0.7
                })
            });

            if (!res.ok) {
                const errText = await res.text().catch(() => '');
                let errMsg;
                try { const err = JSON.parse(errText); errMsg = err.error?.message || err.message || `HTTP ${res.status}`; }
                catch { errMsg = errText || `HTTP ${res.status}`; }
                throw new Error(errMsg);
            }

            const data = await res.json();
            const reply = data.choices?.[0]?.message?.content || data.choices?.[0]?.text;
            if (!reply) throw new Error('AI 没有返回内容');

            // Remove loading
            document.getElementById(loadingId)?.remove();

            // Render reply (support basic Markdown and KaTeX)
            const rendered = renderAiText(reply);
            addAiMessage(rendered, 'bot');
            STATE.aiMessages.push({ role: 'assistant', content: reply });

            document.getElementById('aiStatus').textContent = '就绪';

        } catch (e) {
            document.getElementById(loadingId)?.remove();
            addAiMessage(`<span style="color: var(--md-error);">❌ ${e.message}</span>`, 'bot');
            document.getElementById('aiStatus').textContent = '出错了';
        }

        STATE.aiLoading = false;
        document.getElementById('aiSendBtn').disabled = false;
    }

    function addAiMessage(content, role) {
        const container = document.getElementById('aiMessages');
        const div = document.createElement('div');
        div.className = `ai-msg ${role}`;
        div.innerHTML = content;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        return div;
    }

    function addAiLoading() {
        const container = document.getElementById('aiMessages');
        const div = document.createElement('div');
        div.className = 'ai-msg bot';
        div.id = 'ai-loading-' + Date.now();
        div.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        return div.id;
    }

    function renderAiText(text) {
        // Simple Markdown-like rendering
        let html = text
            .replace(/### (.+)/g, '<div style="font-size: 16px; font-weight: 700; margin: 12px 0 6px;">$1</div>')
            .replace(/## (.+)/g, '<div style="font-size: 18px; font-weight: 700; margin: 16px 0 8px;">$1</div>')
            .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
            .replace(/\*(.+?)\*/g, '<i>$1</i>')
            .replace(/\n/g, '<br>');
        return html;
    }

    /* =========================================
       UTILITIES
       ========================================= */
    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 100) + 'px';
    }

    // Enter to send
    document.addEventListener('DOMContentLoaded', () => {
        const input = document.getElementById('aiInput');
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendAiMessage();
            }
        });

        loadState();
        render();
        
    });
    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') toggleGuideNav(false);
    });
</script>
