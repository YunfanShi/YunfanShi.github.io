<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyGuide · JackYun</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="512x512" href="/Webicon.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/Webicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>

    <style>
        /* =========================================
           Google Material Design 3 主题
           ========================================= */
        :root {
            --md-primary: #1A73E8;
            --md-primary-container: #D2E3FC;
            --md-on-primary: #FFFFFF;
            --md-secondary: #5F6368;
            --md-surface: #FFFFFF;
            --md-surface-variant: #F8F9FA;
            --md-surface-dim: #E8EAED;
            --md-outline: #DADCE0;
            --md-outline-variant: #E8EAED;
            --md-on-surface: #202124;
            --md-on-surface-variant: #5F6368;
            --md-error: #D93025;
            --md-success: #1E8E3E;
            --md-warning: #F9AB00;
            
            --md-elevation-1: 0 1px 3px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.04);
            --md-elevation-2: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.06);
            --md-elevation-3: 0 2px 8px rgba(0,0,0,0.08), 0 6px 20px rgba(0,0,0,0.06);
            --md-elevation-4: 0 4px 16px rgba(0,0,0,0.08), 0 8px 32px rgba(0,0,0,0.06);
            
            --font-sans: 'Google Sans', 'Noto Sans SC', 'Inter', -apple-system, sans-serif;
            --font-mono: 'Google Sans Mono', 'SF Mono', monospace;
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 100px;
            
            --transition: cubic-bezier(0.4, 0, 0.2, 1);
            --transition-decelerated: cubic-bezier(0, 0, 0.2, 1);
            --transition-accelerated: cubic-bezier(0.4, 0, 1, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            background: var(--md-surface-variant);
            color: var(--md-on-surface);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* =========================================
           Layout
           ========================================= */
        .app-container {
            display: flex;
            min-height: 100vh;
        }

        .mobile-guide-bar,
        .mobile-guide-backdrop { display: none; }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--md-surface);
            border-right: 1px solid var(--md-outline-variant);
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            margin-bottom: 24px;
        }
        .sidebar-logo .logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--md-primary), #4285F4);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
        }
        .sidebar-logo .logo-text {
            font-size: 20px;
            font-weight: 600;
            color: var(--md-on-surface);
            letter-spacing: -0.3px;
        }
        .sidebar-logo .logo-badge {
            font-size: 11px;
            color: var(--md-secondary);
            margin-top: 2px;
        }

        .nav-section-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--md-secondary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 16px 16px 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 16px;
            border-radius: var(--radius-full);
            cursor: pointer;
            color: var(--md-on-surface-variant);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s var(--transition);
            text-decoration: none;
            user-select: none;
            position: relative;
        }
        .nav-item:hover {
            background: var(--md-surface-variant);
            color: var(--md-on-surface);
        }
        .nav-item.active {
            background: var(--md-primary-container);
            color: var(--md-primary);
        }
        .nav-item.active .nav-icon { color: var(--md-primary); }
        .nav-icon {
            font-size: 22px;
            color: var(--md-on-surface-variant);
            flex-shrink: 0;
        }
        .nav-item .material-icons-round {
            font-size: 22px;
        }
        .nav-check {
            margin-left: auto;
            width: 18px; height: 18px;
            border-radius: 50%;
            border: 2px solid var(--md-outline);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s var(--transition);
            flex-shrink: 0;
            font-size: 14px;
            color: transparent;
        }
        .nav-check.checked {
            background: var(--md-primary);
            border-color: var(--md-primary);
            color: white;
        }

        /* Main Content Area */
        .main-area {
            flex: 1;
            display: flex;
            min-width: 0;
        }

        .content-scroll {
            flex: 1;
            padding: 40px 48px;
            overflow-y: auto;
            max-width: 900px;
        }

        /* AI Sidebar - currently hidden (主页 AI 已接管) */
        .ai-sidebar {
            display: none;
            width: 380px;
            background: var(--md-surface);
            border-left: 1px solid var(--md-outline-variant);
            flex-direction: column;
            height: 100vh;
            position: sticky;
            top: 0;
            flex-shrink: 0;
        }
        .ai-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--md-outline-variant);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .ai-avatar {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--md-primary), #4285F4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }
        .ai-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--md-on-surface);
        }
        .ai-subtitle {
            font-size: 12px;
            color: var(--md-secondary);
        }
        .ai-messages {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--md-surface-variant);
        }
        .ai-msg {
            max-width: 88%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .ai-msg.bot {
            background: var(--md-surface);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--md-outline-variant);
            color: var(--md-on-surface);
        }
        .ai-msg.user {
            background: var(--md-primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .ai-msg.system {
            background: #FFF8E1;
            color: #795548;
            border: 1px solid #FFE082;
            border-radius: var(--radius-md);
            text-align: center;
            font-size: 12px;
            width: 100%;
            max-width: 100%;
        }
        .ai-input-area {
            padding: 16px 20px 20px;
            border-top: 1px solid var(--md-outline-variant);
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        .ai-input {
            flex: 1;
            border: 1px solid var(--md-outline);
            border-radius: var(--radius-full);
            padding: 10px 18px;
            font-size: 14px;
            font-family: var(--font-sans);
            background: var(--md-surface);
            color: var(--md-on-surface);
            outline: none;
            resize: none;
            max-height: 100px;
            line-height: 1.5;
            transition: border-color 0.2s var(--transition);
        }
        .ai-input:focus {
            border-color: var(--md-primary);
            box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.15);
        }
        .ai-send-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: var(--md-primary);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s var(--transition);
        }
        .ai-send-btn:hover { background: #1557B0; transform: scale(1.05); }
        .ai-send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .ai-status {
            font-size: 11px;
            color: var(--md-secondary);
            text-align: center;
            padding: 4px 16px 0;
            min-height: 20px;
        }

        /* =========================================
           Page Header
           ========================================= */
        .page-header {
            margin-bottom: 32px;
        }
        .page-header h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--md-on-surface);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .page-header .header-icon {
            font-size: 32px;
            color: var(--md-primary);
        }
        .page-header p {
            font-size: 15px;
            color: var(--md-on-surface-variant);
            margin-top: 8px;
            line-height: 1.6;
        }

        /* =========================================
           Tab System
           ========================================= */
        .tabs-container {
            margin-bottom: 32px;
        }

        .main-tabs {
            display: flex;
            gap: 4px;
            background: var(--md-surface-dim);
            border-radius: var(--radius-full);
            padding: 4px;
            position: relative;
        }
        .main-tab {
            flex: 1;
            padding: 10px 20px;
            border-radius: var(--radius-full);
            border: none;
            background: transparent;
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 500;
            color: var(--md-on-surface-variant);
            cursor: pointer;
            transition: all 0.3s var(--transition);
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }
        .main-tab:hover { color: var(--md-on-surface); }
        .main-tab.active {
            background: var(--md-surface);
            color: var(--md-primary);
            box-shadow: var(--md-elevation-1);
        }
        .main-tab .tab-icon {
            font-size: 20px;
        }
        .main-tab .tab-badge {
            font-size: 10px;
            background: var(--md-primary-container);
            color: var(--md-primary);
            padding: 1px 8px;
            border-radius: var(--radius-full);
            margin-left: 4px;
        }

        /* Sub-tabs (for 学习) */
        .sub-tabs {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            padding: 0 4px;
        }
        .sub-tab {
            padding: 8px 20px;
            border-radius: var(--radius-full);
            border: 1px solid var(--md-outline);
            background: transparent;
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 500;
            color: var(--md-on-surface-variant);
            cursor: pointer;
            transition: all 0.2s var(--transition);
        }
        .sub-tab:hover {
            background: var(--md-surface-variant);
            border-color: var(--md-secondary);
        }
        .sub-tab.active {
            background: var(--md-primary-container);
            border-color: var(--md-primary);
            color: var(--md-primary);
        }

        /* Time granule pills */
        .time-pills {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        .time-pill {
            padding: 6px 16px;
            border-radius: var(--radius-full);
            border: 1px solid var(--md-outline);
            background: transparent;
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 500;
            color: var(--md-on-surface-variant);
            cursor: pointer;
            transition: all 0.2s var(--transition);
        }
        .time-pill:hover { border-color: var(--md-primary); color: var(--md-primary); }
        .time-pill.active {
            background: var(--md-primary);
            border-color: var(--md-primary);
            color: white;
        }

        /* =========================================
           Content Cards
           ========================================= */
        .content-panel {
            animation: fadeInUp 0.35s var(--transition-decelerated);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .method-card {
            background: var(--md-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--md-outline-variant);
            padding: 24px;
            margin-bottom: 16px;
            transition: all 0.2s var(--transition);
            box-shadow: var(--md-elevation-1);
        }
        .method-card:hover {
            box-shadow: var(--md-elevation-2);
        }

        .method-card-header {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            cursor: pointer;
        }
        .method-card-icon {
            width: 44px; height: 44px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .method-card-icon.blue { background: #E8F0FE; color: var(--md-primary); }
        .method-card-icon.green { background: #E6F4EA; color: var(--md-success); }
        .method-card-icon.orange { background: #FEF7E0; color: var(--md-warning); }
        .method-card-icon.red { background: #FCE8E6; color: var(--md-error); }
        .method-card-icon.purple { background: #F3E8FD; color: #9334E6; }

        .method-card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--md-on-surface);
            margin-bottom: 4px;
        }
        .method-card-subtitle {
            font-size: 13px;
            color: var(--md-on-surface-variant);
            line-height: 1.5;
        }
        .method-card-expand {
            margin-left: auto;
            color: var(--md-outline);
            transition: transform 0.3s var(--transition);
        }
        .method-card.expanded .method-card-expand {
            transform: rotate(180deg);
        }

        .method-card-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s var(--transition-decelerated), opacity 0.25s var(--transition);
            opacity: 0;
        }
        .method-card.expanded .method-card-body {
            max-height: 2000px;
            opacity: 1;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--md-outline-variant);
        }

        .method-step {
            display: flex;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--md-surface-dim);
        }
        .method-step:last-child { border-bottom: none; }
        .method-step-num {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--md-primary-container);
            color: var(--md-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .method-step-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--md-on-surface);
            margin-bottom: 4px;
        }
        .method-step-desc {
            font-size: 13px;
            color: var(--md-on-surface-variant);
            line-height: 1.6;
        }
        .method-step-desc code {
            background: var(--md-surface-variant);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-family: var(--font-mono);
        }
        .more-details {
            margin-top: 10px;
            border: 1px solid var(--md-outline-variant);
            border-radius: var(--radius-md);
            background: var(--md-surface-container-low);
            overflow: hidden;
        }
        .more-details summary {
            cursor: pointer;
            padding: 9px 12px;
            color: var(--md-primary);
            font-size: 13px;
            font-weight: 600;
            list-style: none;
        }
        .more-details summary::-webkit-details-marker { display: none; }
        .more-details summary::after {
            content: '＋';
            float: right;
            color: var(--md-outline);
        }
        .more-details[open] summary::after { content: '－'; }
        .more-details-body {
            padding: 0 12px 12px;
            color: var(--md-on-surface-variant);
            font-size: 13px;
            line-height: 1.7;
        }
        .more-details-body b { color: var(--md-on-surface); }
        .more-details-body p { margin: 7px 0 0; }

        /* Checklist inside card */
        .checklist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            cursor: pointer;
        }
        .checklist-checkbox {
            width: 22px; height: 22px;
            border-radius: 50%;
            border: 2px solid var(--md-outline);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s var(--transition);
            font-size: 16px;
            color: transparent;
        }
        .checklist-checkbox.checked {
            background: var(--md-primary);
            border-color: var(--md-primary);
            color: white;
        }
        .checklist-label {
            font-size: 14px;
            color: var(--md-on-surface);
            flex: 1;
        }
        .checklist-label.done {
            text-decoration: line-through;
            color: var(--md-on-surface-variant);
        }

        /* =========================================
           Time Timeline (今日板块专用)
           ========================================= */
        .timeline {
            position: relative;
            padding-left: 32px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 11px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--md-outline-variant);
        }
        .timeline-item {
            position: relative;
            padding-bottom: 20px;
        }
        .timeline-dot {
            position: absolute;
            left: -24px;
            top: 4px;
            width: 12px; height: 12px;
            border-radius: 50%;
            background: var(--md-primary);
            border: 3px solid var(--md-primary-container);
        }
        .timeline-time {
            font-size: 12px;
            font-weight: 600;
            color: var(--md-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .timeline-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--md-on-surface);
            margin-bottom: 4px;
        }
        .timeline-desc {
            font-size: 13px;
            color: var(--md-on-surface-variant);
            line-height: 1.5;
        }

        .execution-note {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            margin: 16px 0;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
            line-height: 1.55;
            font-size: 13px;
        }
        .execution-note strong { display: block; margin-bottom: 3px; }
        .principle-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin: 16px 0 20px;
        }
        .principle-item {
            padding: 14px 16px;
            border: 1px solid var(--md-outline-variant);
            border-radius: var(--radius-md);
            background: var(--md-surface);
            color: var(--md-on-surface-variant);
            font-size: 13px;
            line-height: 1.6;
        }
        .principle-item strong {
            display: block;
            margin-bottom: 4px;
            color: var(--md-on-surface);
            font-size: 14px;
        }
        .source-panel {
            margin-top: 24px;
            padding: 18px;
            border: 1px solid var(--md-outline-variant);
            border-radius: var(--radius-lg);
            background: var(--md-surface);
            color: var(--md-on-surface-variant);
            font-size: 12px;
            line-height: 1.7;
        }
        .source-panel summary { cursor: pointer; color: var(--md-on-surface); font-weight: 600; }
        .source-panel a { color: var(--md-primary); overflow-wrap: anywhere; }
        .source-links { display: grid; gap: 5px; margin-top: 10px; }
        .priority-badge {
            display: inline-block;
            margin: 4px 0 6px;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
        }
        .priority-badge.required { background: #E8F0FE; color: var(--md-primary); }
        .priority-badge.optional { background: var(--md-surface-variant); color: var(--md-on-surface-variant); }

        /* =========================================
           Modal / Dialog
           ========================================= */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 0.2s var(--transition);
        }
        .modal-overlay.show { display: flex; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-sheet {
            background: var(--md-surface);
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            padding: 24px 32px 32px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 -8px 32px rgba(0,0,0,0.12);
            animation: slideUp 0.3s var(--transition-decelerated);
            max-height: 70vh;
            overflow-y: auto;
        }

    const EXPANDED_DETAILS = {
        '定今天的结果': '<b>为什么：</b>“学习物理”没有终点，容易做了很久仍不知道是否完成。<p><b>怎么定：</b>写成“动作 + 范围 + 检测”。例如：闭卷解释电磁感应方向，并独立做2道基础题。</p><p><b>优先级：</b>先最大短板，再维持强项；每科只留一个结果。</p>',

    /* =========================================
       STATE
       ========================================= */
    const STATE = {

        subTab: null,
        timeGranule: 'daily',
        examMode: false,
        progress: {},
        aiMessages: [],
        aiLoading: false
    };

    // Load from localStorage
    function loadState() {
        try {
            const saved = JSON.parse(localStorage.getItem('studyguide_progress') || '{}');
            STATE.progress = saved.checklists || {};
            STATE.examMode = saved.examMode || false;
            STATE.mainTab = saved.lastTab || 'today';
            STATE.timeGranule = saved.lastGranule || 'daily';
        } catch(e) { /* ignore */ }
    }

    function saveState() {
        try {
            localStorage.setItem('studyguide_progress', JSON.stringify({
                checklists: STATE.progress,
                examMode: STATE.examMode,
                lastTab: STATE.mainTab,
                lastGranule: STATE.timeGranule
            }));
        } catch(e) { /* ignore */ }
    }

    /* =========================================
       TODAY DETECTION
       ========================================= */
    function getTodayInfo() {
        const now = new Date();
        const day = now.getDay(); // 0=Sunday, 1-5=weekday, 6=Saturday
        const isWeekend = day === 0 || day === 6;
        const isSunday = day === 0;
        const isSaturday = day === 6;
        
        // Check if this is a "biweekly" Sunday (every other Sunday)
        let isBiweeklySunday = false;
        if (isSunday) {
            const lastBiweekly = localStorage.getItem('studyguide_last_biweekly');
            if (lastBiweekly) {
                const diff = Math.floor((now.getTime() - new Date(lastBiweekly).getTime()) / 86400000);
                isBiweeklySunday = diff >= 12; // ~2 weeks
            } else {
                isBiweeklySunday = true; // First time
            }
        }

        return { day, isWeekend, isSunday, isSaturday, isBiweeklySunday, now };
    }

    /* =========================================
       RENDER ENGINE
       ========================================= */
    function switchMainTab(tab) {
        STATE.mainTab = tab;
        STATE.subTab = null;
        
        // Update nav
        document.querySelectorAll('.nav-item').forEach(el => {
            el.classList.toggle('active', el.dataset.tab === tab);
        });

        // Set default sub-tab
        if (tab === 'learn') STATE.subTab = 'preview';
        if (tab === 'workflow') STATE.subTab = 'core';
        if (tab === 'practice') STATE.subTab = 'daily';
        if (tab === 'exam') STATE.subTab = '2weeks';
        if (tab === 'procrastination') STATE.subTab = 'mindset';

        render();
        saveState();
        toggleGuideNav(false);
    }

    function toggleGuideNav(open) {
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.querySelector('.mobile-guide-backdrop');
        const trigger = document.querySelector('.mobile-guide-menu');
        if (!sidebar || !backdrop || !trigger) return;
        sidebar.classList.toggle('mobile-open', open);
        backdrop.classList.toggle('mobile-open', open);
        document.body.classList.toggle('guide-nav-open', open);
        trigger.setAttribute('aria-expanded', String(open));
    }

    function switchSubTab(subTab) {
        STATE.subTab = subTab;
        render();
    }

    function switchTimeGranule(granule) {
        STATE.timeGranule = granule;
        saveState();
        render();
    }

    function launchPomodoroPreset(preset) {
        if (preset !== 'standard' && preset !== 'deep') return;
        localStorage.setItem('pomodoro_launch_preset', preset);
        const destination = window.top.location.protocol === 'file:' ? 'Pomodoro.html' : '/pomodoro';
        window.top.location.href = destination;
    }

    function render() {

            if (STATE.mainTab === 'today') {

    }

        const todayKey = formatDateKey(info.now);

                <div>
                    ${subContent?.when ? `<strong>什么时候用</strong>${subContent.when}` : ''}
                    ${subContent?.done ? `<br><strong>做到什么算完成</strong>${subContent.done}` : ''}
                </div>
            </div>
            ` : ''}

            <div class="content-panel">
                ${renderGranuleContent(subContent, activeGranule, tab, activeSub)}
            </div>
        `;
    }

    function renderGranuleContent(subContent, granuleKey, tab, subTab) {
        if (!subContent || !subContent.granules) return '';
        
        const granule = subContent.granules[granuleKey];
        if (!granule) return `<p class="text-muted">该时间粒度暂无内容</p>`;

        const progressKey = `${tab}_${subTab}_${granuleKey}`;
        const progress = STATE.progress[progressKey] || {};

        // Steps-based rendering
        if (granule.steps) {
            return `
                <div class="method-card expanded">
                    <div class="method-card-header">
                        <div class="method-card-icon blue">
                            <span class="material-icons-round">${subContent.icon || 'checklist'}</span>
                        </div>
                        <div>
                            <div class="method-card-title">${granule.label}</div>
                            <div class="method-card-subtitle">${subContent.desc}</div>
                        </div>
                    </div>
                    <div class="method-card-body" style="max-height: 2000px; opacity: 1; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--md-outline-variant);">
                        ${granule.steps.map((step, i) => `
                            <div class="method-step">
                                <div class="method-step-num">${step.num}</div>
                                <div>
                                    <div class="method-step-title">${step.title}</div>
                                    <div class="method-step-desc">${step.desc}</div>
                                    ${renderExpandedDetails(step.title, step.detail)}
                                </div>
                            </div>
                        `).join('')}
                        
                        <div class="checklist-item mt-4" role="button" tabindex="0" aria-label="标记本节完成" onclick="toggleModuleCheck('${progressKey}', 'done')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleModuleCheck('${progressKey}', 'done')}" >
                            <div class="checklist-checkbox ${progress['done'] ? 'checked' : ''}">
                                <span class="material-icons-round" style="font-size: 16px;">${progress['done'] ? 'check' : ''}</span>
                            </div>
                            <div class="checklist-label ${progress['done'] ? 'done' : ''}">
                                ${progress['done'] ? '本节已完成 ✓' : '标记为已完成'}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Sections-based rendering
        if (granule.sections) {
            return granule.sections.map((sec, si) => `
                <div class="method-card expanded">
                    <div class="method-card-header">
                        <div class="method-card-icon ${si === 0 ? 'blue' : si === 1 ? 'green' : 'orange'}">
                            <span class="material-icons-round">${sec.type === 'table' ? 'table_chart' : sec.type === 'fields' ? 'list_alt' : sec.type === 'feynman' ? 'psychology' : 'article'}</span>
                        </div>
                        <div>
                            <div class="method-card-title">${sec.title}</div>
                            <div class="method-card-subtitle">${sec.desc || ''}</div>
                        </div>
                    </div>
                    <div class="method-card-body" style="max-height: 2000px; opacity: 1; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--md-outline-variant);">
                        ${sec.type === 'table' && sec.rows ? `
                            ${sec.rows.map((row, ri) => `
                                <div class="method-step">
                                    <div class="method-step-num">${ri + 1}</div>
                                    <div>
                                        <div class="method-step-title">${row.state}</div>
                                        <div class="method-step-desc"><b>操作：</b>${row.action}</div>
                                        <div class="method-step-desc mt-2"><b>要点：</b>${row.note}</div>
                                        ${renderExpandedDetails(row.state, row.detail)}
                                    </div>
                                </div>
                            `).join('')}
                        ` : sec.type === 'fields' && sec.fields ? `
                            ${sec.fields.map((f, fi) => `
                                <div class="method-step">
                                    <div class="method-step-num">${fi + 1}</div>
                                    <div>
                                        <div class="method-step-title">${f.name}</div>
                                        <div class="method-step-desc">${f.desc}</div>
                                        ${renderExpandedDetails(f.name, f.detail)}
                                    </div>
                                </div>
                            `).join('')}
                        ` : sec.type === 'feynman' && sec.dims ? `
                            <div class="method-step-desc" style="margin-bottom: 12px;">到了"下次检查日期"，拿出错题，不要动笔算。看着题目，张嘴给自己讲：</div>
                            ${sec.dims.map((d, di) => `
                                <div class="method-step">
                                    <div class="method-step-num">${di + 1}</div>
                                    <div>
                                        <div class="method-step-title">${d.name}</div>
                                        <div class="method-step-desc">${d.desc}</div>
                                        ${renderExpandedDetails(d.name, d.detail)}
                                    </div>
                                </div>
                            `).join('')}
                            <div class="method-step-desc mt-2" style="padding: 12px; background: var(--md-surface-variant); border-radius: var(--radius-md);">
                                <b>判定：</b>快速、准确、完整讲清→间隔升级；讲出大概但漏条件→保持当前间隔；卡壳、猜测或看答案才想起→打回"明天"。默认节奏为1→3→5→7→14天；在不同题目上连续2次正确应用才归档。
                            </div>
                        ` : `
                            <div class="method-step-desc">${sec.details || sec.desc || ''}</div>
                            ${renderExpandedDetails(sec.title, sec.detail)}
                        `}
                        
                        <div class="checklist-item mt-4" role="button" tabindex="0" aria-label="标记此项完成" onclick="toggleModuleCheck('${progressKey}_${si}', 'done')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleModuleCheck('${progressKey}_${si}', 'done')}" >
                            <div class="checklist-checkbox ${(STATE.progress[progressKey + '_' + si] || {}).done ? 'checked' : ''}">
                                <span class="material-icons-round" style="font-size: 16px;">${(STATE.progress[progressKey + '_' + si] || {}).done ? 'check' : ''}</span>
                            </div>
                            <div class="checklist-label ${(STATE.progress[progressKey + '_' + si] || {}).done ? 'done' : ''}">
                                ${(STATE.progress[progressKey + '_' + si] || {}).done ? '已完成 ✓' : '标记为已完成'}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        return '';
    }

    function toggleModuleCheck(key, field) {
        if (!STATE.progress[key]) STATE.progress[key] = {};
        STATE.progress[key][field] = !STATE.progress[key][field];
        saveState();
        updateNavChecks();
        
        // Re-render only the checkmarks
        const area = document.getElementById('contentArea');
        if (STATE.mainTab === 'today') {
            render();
        } else {
            render();
        }
    }

    /* =========================================
       NAV CHECKS
       ========================================= */
    function updateNavChecks() {
        // Count progress for each tab
        const tabs = ['today', 'learn', 'practice', 'exam'];
        tabs.forEach(tab => {
            const check = document.getElementById(`check-${tab}`);
            if (!check) return;
            
            // Simple heuristic: if any progress exists for this tab
            let hasProgress = false;
            const todayKey = formatDateKey(new Date());
            
            if (tab === 'today') {
                const todayProg = STATE.progress[todayKey] || {};
                hasProgress = Object.values(todayProg).some(v => v);
            } else {
                for (const key in STATE.progress) {
                    if (key.startsWith(tab)) {
                        hasProgress = true;
                        break;
                    }
                }
            }
            
            check.classList.toggle('checked', hasProgress);
        });
    }

    /* =========================================
       TODAY MODAL
       ========================================= */
    function showTodayModal() {
        const info = getTodayInfo();
        const overlay = document.getElementById('modalOverlay');
        const title = document.getElementById('modalTitle');
        const desc = document.getElementById('modalDesc');
        const actions = document.getElementById('modalActions');

        let msg = '';
        let buttons = [];

        if (!info.isWeekend) {
            // Weekday
            msg = '今天是工作日，为你展示每日方法。';
            buttons = [
                { label: '📅 查看每周方法', cb: () => { switchTimeGranule('weekly'); closeModal(); } },
                { label: '📆 查看每两周方法', cb: () => { switchTimeGranule('biweekly'); closeModal(); } },
                { label: '🎯 查看考前方法', cb: () => { switchTimeGranule('exam'); closeModal(); } },
                { label: '✓ 仅看今日', cb: () => closeModal(), primary: true }
            ];
        } else if (info.isSaturday) {
            msg = '今天是周六，为你展示每周方法。';
            buttons = [
                { label: '📅 查看每日方法', cb: () => { switchTimeGranule('daily'); closeModal(); } },
                { label: '📆 查看每两周方法', cb: () => { switchTimeGranule('biweekly'); closeModal(); } },
                { label: '🎯 查看考前方法', cb: () => { switchTimeGranule('exam'); closeModal(); } },
                { label: '✓ 仅看今日', cb: () => closeModal(), primary: true }
            ];
        } else {
            // Sunday
            if (info.isBiweeklySunday) {
                msg = '今天是隔周周日，为你展示每两周方法。可以做查漏补缺。';
                buttons = [
                    { label: '📅 查看每日方法', cb: () => { switchTimeGranule('daily'); closeModal(); } },
                    { label: '📆 查看每周方法', cb: () => { switchTimeGranule('weekly'); closeModal(); } },
                    { label: '🎯 查看考前方法', cb: () => { switchTimeGranule('exam'); closeModal(); } },
                    { label: '✓ 仅看今日', cb: () => { 
                        localStorage.setItem('studyguide_last_biweekly', new Date().toISOString());
                        closeModal(); 
                    }, primary: true }
                ];
            } else {
                msg = '今天是周日，为你展示每周收尾方法。';
                buttons = [
                    { label: '📅 查看每日方法', cb: () => { switchTimeGranule('daily'); closeModal(); } },
                    { label: '📆 查看每两周方法', cb: () => { switchTimeGranule('biweekly'); closeModal(); } },
                    { label: '🎯 查看考前方法', cb: () => { switchTimeGranule('exam'); closeModal(); } },
                    { label: '✓ 仅看今日', cb: () => closeModal(), primary: true }
                ];
            }
        }

        title.textContent = '💡今日学习模式';
        desc.textContent = msg;
        actions.innerHTML = buttons.map(btn => `
            <button class="modal-btn ${btn.primary ? 'primary' : ''}" onclick="(${btn.cb.toString()})()">${btn.label}</button>
        `).join('');

        overlay.classList.add('show');
    }

    function closeModal(e) {
        if (e && e.target !== document.getElementById('modalOverlay') && !e.target.closest('.modal-overlay')) return;
        document.getElementById('modalOverlay').classList.remove('show');
    }

    /* =========================================
       AI CHAT
       ========================================= */
    async function sendAiMessage() {
        const input = document.getElementById('aiInput');
        const text = input.value.trim();
        if (!text || STATE.aiLoading) return;

        input.value = '';
        autoResize(input);

        // Add user message
        addAiMessage(text, 'user');
        STATE.aiMessages.push({ role: 'user', content: text });

        // Show loading
        const loadingId = addAiLoading();
        STATE.aiLoading = true;
        document.getElementById('aiStatus').textContent = '思考中...';
        document.getElementById('aiSendBtn').disabled = true;

        try {
            // Read AI config from localStorage (same as other pages)
            const cfg = JSON.parse(localStorage.getItem('jackyun-ai-config') || '{}');
            if (!cfg.apiKey) throw new Error('请先在 Jackyun Portal 的设置页面配置 AI API Key');

            const systemPrompt = `你是 JackYun Portal 的**学习指导导师（StudyGuide）**，专注于帮助用户掌握高效学习方法。

你的定位：
- 你是 JackYun Portal 学习系统（StudyGuide）的内置 AI 助手
- 网站提供 5 大板块：今日（根据工作日/周末智能展示）、学习（含预习/学习/复习&总结）、习题（做题&错题）、考试（考前冲刺）、拖延症应对（认知重塑/实战方法/环境仪式）
- 每个板块按 每日/每周/每两周 三个时间粒度组织

你的能力：
1. 📖 解释任何板块的方法论（如什么是 4-P 框架、康奈尔笔记法、费曼技巧、计划谬误、两分钟法则）
2. 🧠 针对用户的具体学科（数学/物理/CS/IELTS）给出定制化建议
3. 📋 帮用户规划每日/每周学习节奏
4. ❓ 解答学习过程中遇到的具体问题（概念、公式、题目思路）
5. 🔧 帮用户诊断学习卡点（如"为什么我总在边界条件上出错"）和执行卡点（拖延、计划完不成、注意力分散）
6. 🧘 针对拖延症给出具体建议（目标原子化、两分钟启动、手机隔离、番茄钟休息注意事项、睡眠与状态底座等）
7. 📚 引导完整学习闭环：预习猜逻辑→康奈尔记录→遮挡回忆→主动解释→基础题→变式题→找漏洞→回教材/老师/AI→再做→当天或第二天复习。
8. 🧪 处理刷题与考试策略：陌生题三步拆解、简单/中等/困难预扫描、1/3/5/7/14天错题间隔、强弱科分流和“套卷用于暴露问题”的原则。

回复风格：
- Google Material Design 风格：简洁、现代、结构化
- 使用清晰的层级：标题 → 要点 → 示例
- 如果涉及公式，使用 $...$ 或 $...$ 格式
- 对于学习方法类问题，引用该页面中的具体板块和时间线
- 语言：优先使用中文回答`;

            const res = await fetch('/api/llm-proxy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    baseUrl: cfg.baseUrl,
                    apiKey: cfg.apiKey,
                    model: cfg.model || 'deepseek-chat',
                    messages: [
                        { role: 'system', content: systemPrompt },
                        ...STATE.aiMessages.slice(-10)
                    ],
                    stream: false,
                    max_tokens: 2000,
                    temperature: 0.7
                })
            });

            if (!res.ok) {
                const errText = await res.text().catch(() => '');
                let errMsg;
                try { const err = JSON.parse(errText); errMsg = err.error?.message || err.message || `HTTP ${res.status}`; }
                catch { errMsg = errText || `HTTP ${res.status}`; }
                throw new Error(errMsg);
            }

            const data = await res.json();
            const reply = data.choices?.[0]?.message?.content || data.choices?.[0]?.text;
            if (!reply) throw new Error('AI 没有返回内容');

            // Remove loading
            document.getElementById(loadingId)?.remove();

            // Render reply (support basic Markdown and KaTeX)
            const rendered = renderAiText(reply);
            addAiMessage(rendered, 'bot');
            STATE.aiMessages.push({ role: 'assistant', content: reply });

            document.getElementById('aiStatus').textContent = '就绪';

        } catch (e) {
            document.getElementById(loadingId)?.remove();
            addAiMessage(`<span style="color: var(--md-error);">❌ ${e.message}</span>`, 'bot');
            document.getElementById('aiStatus').textContent = '出错了';
        }

        STATE.aiLoading = false;
        document.getElementById('aiSendBtn').disabled = false;
    }

    function addAiMessage(content, role) {
        const container = document.getElementById('aiMessages');
        const div = document.createElement('div');
        div.className = `ai-msg ${role}`;
        div.innerHTML = content;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        return div;
    }

    function addAiLoading() {
        const container = document.getElementById('aiMessages');
        const div = document.createElement('div');
        div.className = 'ai-msg bot';
        div.id = 'ai-loading-' + Date.now();
        div.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        return div.id;
    }

    function renderAiText(text) {
        // Simple Markdown-like rendering
        let html = text
            .replace(/### (.+)/g, '<div style="font-size: 16px; font-weight: 700; margin: 12px 0 6px;">$1</div>')
            .replace(/## (.+)/g, '<div style="font-size: 18px; font-weight: 700; margin: 16px 0 8px;">$1</div>')
            .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
            .replace(/\*(.+?)\*/g, '<i>$1</i>')
            .replace(/\n/g, '<br>');
        return html;
    }

    /* =========================================
       UTILITIES
       ========================================= */
    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 100) + 'px';
    }

    // Enter to send
    document.addEventListener('DOMContentLoaded', () => {
        const input = document.getElementById('aiInput');
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendAiMessage();
            }
        });

        loadState();
        render();
        
        // Show modal on first visit of the day
        const lastVisit = localStorage.getItem('studyguide_last_visit');
        const today = formatDateKey(new Date());
        if (lastVisit !== today) {
            localStorage.setItem('studyguide_last_visit', today);
            setTimeout(() => showTodayModal(), 500);
        }
    });
    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') toggleGuideNav(false);
    });
</script>
