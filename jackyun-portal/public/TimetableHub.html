  const tryAll=JSON.stringify(plan).toLowerCase();
  // 1. 整体偏移
  const shiftM=txt.match(/(?:后移|推迟|延后|晚)\s*(\d+)\s*分/);
  const shiftE=txt.match(/(?:前移|提前|早)\s*(\d+)\s*分/);
  if(shiftM||shiftE){
    const off=(shiftM?+shiftM[1]:-(shiftE?+shiftE[1]:0));
    quickShift(off);
    return;
  }
  // 2. 互换
  const swapM=txt.match(/(?:互换|交换|调换)\s*(.+?)\s*(?:和|与|跟)\s*(.+)/);
  if(swapM){
    const a=findTaskByName(swapM[1]),b=findTaskByName(swapM[2]);
    if(a&&b&&a.sched&&b.sched){
      const ts={...a.sched};a.sched={...b.sched};b.sched=ts;
      saveNow(true);renderAll();msg('✅ 已互换');
      return;
    }
  }
  // 3. 修改单一任务时间
  const moveM=txt.match(/(?:把|将|移动)\s*(.+?)\s*(?:移|调|改)?\s*(?:到|至)\s*(\d{1,2}):(\d{2})/);
  if(moveM){
    const t=findTaskByName(moveM[1]);
    if(t){const m=t2min(`${moveM[2]}:${moveM[3]}`);if(!t.sched)t.sched={dayIdx:0,startMin:m,durMin:t.duration};else t.sched.startMin=m;saveNow(true);renderAll();msg('✅ 已移动');return}
  }
  // 4. 特定任务时长
  const durM=txt.match(/(?:时长|改成|调成)\s*(\d+)\s*分/);
  if(durM&&txt.includes('任务')){
    msg('⚠ 请指明哪个任务（如"把数学时长改成45分"）');
    return;
  }
  msg('⚠ 无法理解指令。试试"所有任务后移30分钟"或"把数学和英语互换"');
}
function findTaskByName(partial){
  return plan.tasks.find(t=>t.name.includes(partial.trim().replace(/[的了吗]/g,'')));
}
window.quickShift=function(offset){
  let n=0;
  for(const t of plan.tasks){
    if(t.sched){
      t.sched.startMin=Math.max(MIN_DAY,Math.min(MAX_DAY-t.duration,t.sched.startMin+offset));
      n++;
    }
  }
  saveNow(true);renderAll();
  msg(`已整体${offset>0?'后移':'前移'} ${Math.abs(offset)} 分钟（${n} 个任务）`);
  toggleAiMenu(false);
};

// ===== GOAL IMPORT =====
function openImportGoal(){
  let goals=[];
  try{goals=JSON.parse(localStorage.getItem('jackyun_goal_data')||localStorage.getItem('gt_v6')||'[]')}catch(e){goals=[]}
  if(!Array.isArray(goals)||!goals.length){msg('未找到 Goal 数据');return}
  let timeEst={};
  try{timeEst=JSON.parse(localStorage.getItem('jackyun_goal_time_est')||'{}').goals||{}}catch(e){}
  const impBox=$('impList');
  impBox.innerHTML='';
  // ⚠️ 允许多开：同一个 Goal 可以重复导入多次（不再用 fromGoal 去重）
  // 已导入过的目标会显示「已导入」标记，但用户仍可勾选再次导入
  const importedGoalIds=new Set(plan.tasks.filter(t=>t.fromGoal).map(t=>t.fromGoal));
  const colMap={'blue':'#4d9ef7','green':'#34c76a','yellow':'#f5a623','red':'#ff5c5c','purple':'#b57bee','teal':'#2dd4bf','pink':'#f472b6','orange':'#fb923c'};
  goals.forEach(g=>{
    const total=Number(g.total)||0,done=Number(g.done)||0,rem=Math.max(0,total-done);
    const parent=goals.find(p=>p.id===g.parentId);
    const est=timeEst[g.id];
    let dur=60;
    if(est&&est.minutes)dur=Math.min(8*60,Math.max(20,Math.round(rem*est.minutes)));
    else if(rem)dur=Math.min(8*60,Math.max(30,Math.round(rem/30*60)));
    const lvl=g.parentId?'子':'主';
    const already=importedGoalIds.has(g.id);
    const div=document.createElement('div');
    div.className='imp-item';
    div.innerHTML=`<input type="checkbox" ${already?'':'checked'} data-id="${g.id}">
      <span class="imp-dot" style="width:8px;height:8px;border-radius:50%;background:${colMap[parent?.color]||colMap[g.color]||'#4d9ef7'};flex-shrink:0"></span>
      <div style="flex:1;min-width:0"><div class="imp-n">${parent?`<span style="font-size:10px;color:var(--text3)">${esc(parent.name)} · </span>`:''}${esc(g.name)}</div>
      <div class="imp-d">${lvl}任务 · 剩余 ${rem} · 估 ${Math.round(dur)}min${already?' · <span style="color:var(--yellow)">↻ 已在任务池，可多开</span>':''}</div></div>`;
    div.dataset.dur=dur;
    div.dataset.parent=g.parentId||'';
    div.dataset.color=colMap[g.color]||colMap[parent?.color]||'#4d9ef7';
    impBox.appendChild(div);
  });
  $('importGoal').classList.add('o');
}
function doImportGoal(){
  const checked=[...document.querySelectorAll('#impList input:checked')];
  if(!checked.length){msg('未选择任务');return}
  let imported=0;
  checked.forEach(cb=>{
    const row=cb.closest('.imp-item');
    const gid=cb.dataset.id;
    const goal=JSON.parse(localStorage.getItem('jackyun_goal_data')||localStorage.getItem('gt_v6')||'[]').find(g=>g.id==gid);
    if(!goal)return;
    const parent=JSON.parse(localStorage.getItem('jackyun_goal_data')||'[]').find(p=>p.id===goal.parentId);
    const tid=uid();
    plan.tasks.push({id:tid,parentId:null,name:parent?parent.name+' · '+goal.name:goal.name,
      duration:parseInt(row.dataset.dur)||60,priority:goal.priority||3,color:row.dataset.color,
      notes:goal.desc||'',progress:Math.round((Number(goal.done)||0)/Math.max(1,Number(goal.total)||1)*100),
      collapsed:true,sched:null,fromGoal:goal.id});
    selectedTaskIds.add(tid);
    imported++;
  });
  saveNow(false);$('importGoal').classList.remove('o');renderAll();
  msg(`✅ 已导入 ${imported} 个任务`);
}
// ===== DATA EXPORT/IMPORT =====
function expD(){
  const data={v:2,plans,active:planId,plan,
    exportedAt:new Date().toISOString()};
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b);const a=document.createElement('a');
  a.href=u;a.download=`timetablehub-${todayStr()}.json`;a.click();URL.revokeObjectURL(u);
}
function impD(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(d.plans&&Array.isArray(d.plans)){
        // merge: append plans not existing
        for(const p of d.plans){
          if(!plans.find(x=>x.id===p.id)){
            plans.push(p);
            if(d.plan&&d.plan.id===p.id)localStorage.setItem(LS_PLANS+p.id,JSON.stringify(d.plan));
          }
        }
        saveNow(false);renderAll();loadPlan(plans[plans.length-1].id);msg('✅ 已导入');
      }else if(d.plan){
        const p={id:uid(),name:d.plan.name||'导入方案',color:d.plan.color||'#4d9ef7',createdAt:new Date().toISOString()};
        const np={...d.plan,id:p.id};plans.push(p);localStorage.setItem(LS_PLANS+p.id,JSON.stringify(np));
        saveNow(false);switchPlan(p.id);msg('✅ 已导入');
      }else{msg('无效文件')}
    }catch(e){msg('导入失败')}
  };
  r.readAsText(f);
  e.target.value='';
}
function clrAll(){
  if(!confirm('清除当前方案的全部任务和固定块？不可恢复！'))return;
  plan.tasks=[];plan.fixedBlocks=[];
  saveNow(true);renderAll();
}

  el.innerHTML=COLORS.map(c=>`<div class="cdot${c===sel?' s':''}" style="background:${c};color:${c}" onclick="pkC(event,'${id}','${c}')"></div>`).join('');

// ===== KEYBOARD =====
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveNow(true)}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){
    e.preventDefault();
    if(e.shiftKey)redoPlanChange();else undoPlanChange();
  }
  if(e.key==='Escape'){closeAiPanel()}
});

// ===== INIT =====
// ===== BATCH OPERATIONS =====
let batchMode=false;
function toggleBatchMode(){
  batchMode=!batchMode;
  const bar=$('batchActionBar');
  const btn=$('batchModeBtn');
  if(bar) bar.style.display=batchMode?'flex':'none';
  if(btn) btn.style.color=batchMode?'var(--green)':'';
  if(!batchMode) batchClear();
  updateBatchCount();
}
function updateBatchCount(){
  const n=selectedTaskIds.size;
  const el=$('batchCount');
  if(el) el.textContent=n;
}
function batchClear(){
  selectedTaskIds.clear();
  renderTaskPool();
  updateBatchCount();
}
function batchDelete(){
  if(selectedTaskIds.size===0){msg('请先选择任务');return}
  if(!confirm(`删除选中的 ${selectedTaskIds.size} 个任务？`))return;
  plan.tasks=plan.tasks.filter(t=>!selectedTaskIds.has(t.id));
  for(const fb of plan.fixedBlocks||[])fb.tasks=fb.tasks.filter(x=>!selectedTaskIds.has(x.taskId));
  selectedTaskIds.clear();
  saveNow(false);renderAll();msg('✅ 已批量删除');
}
function batchDelay(){
  if(selectedTaskIds.size===0){msg('请先选择任务');return}
  const v=prompt(`为选中的 ${selectedTaskIds.size} 个任务统一延迟多少分钟？`,'30');
  if(v===null)return;
  const off=parseInt(v)||0;
  if(!off){msg('无效的分钟数');return}
  let n=0;
  for(const t of plan.tasks){
    if(t.sched&&selectedTaskIds.has(t.id)){
      const dur=t.sched.durMin||t.duration||60;
      t.sched.startMin=Math.max(MIN_DAY,Math.min(MAX_DAY-dur,t.sched.startMin+off));
      n++;
    }
  }
  if(!n)msg('选中的任务均未排程，无法延迟');
  else{msg(`✅ 已统一延迟 ${Math.abs(off)} 分钟（${n} 个任务）`)}
  saveNow(false);renderAll();renderTaskPool();
}
function batchEdit(){
  if(selectedTaskIds.size===0){msg('请先选择任务');return}
  const v=prompt('统一设置的优先级（1=低 2=中低 3=普通 4=高 5=紧急）','3');
  if(v===null)return;
  const p=parseInt(v)||3;
  if(p<1||p>5){msg('优先级需在 1-5 之间');return}
  let n=0;
  for(const t of plan.tasks){
    if(selectedTaskIds.has(t.id)){t.priority=p;n++;}
  }
  saveNow(false);renderAll();msg(`✅ 已批量修改 ${n} 个任务的优先级`);
}
// hook toggleTaskSel to update batch count
const _origToggleTaskSel=toggleTaskSel;
toggleTaskSel=function(id,e){
  _origToggleTaskSel.apply(this,arguments);
  updateBatchCount();
};

function init(){
  // 恢复临时模式设置
  try{tempMode=localStorage.getItem(LS_TEMP_MODE)==='1'}catch(e){}
  applyTempMode();
  applyDayRangeInputs();
  loadAll();
  // sidebar default collapsed — already collapsed by CSS
  // 监听外部（Goal 推送 / AI 工具）对方案数据的修改 → 自动重载
  window.addEventListener('storage',e=>{
    const k=e.key;
    if(k===LS_ACTIVE||k===LS_PLANS||(k&&k.startsWith(LS_PLANS))||k==='jack_timetable_plan'||k==='w3_schedule'){
      if(k===LS_ACTIVE&&e.newValue!==planId){loadAll();renderAll();return;}
      // 方案详情变化：仅当前激活方案重载，避免重复初始化
      if(k&&k.startsWith(LS_PLANS)&&k===LS_PLANS+planId){
        loadAll();renderAll();
      }
    }
  });
  // 请求父窗口把最新方案同步给我们（iframe 内 storage 不跨 iframe 触发）
  window.addEventListener('message',e=>{
    const d=e.data||{};
    if(d.type==='goal-daily-plan-pushed'||d.type==='timetablehub-sync'){
      loadAll();renderAll();msg('📥 已同步最新日程数据');
    }
  });
  // request latest plan from parent if this is in iframe (Control sync)
  if(window.parent!==window){
    try{window.parent.postMessage({type:'timetablehub-request'},'*')}catch(e){}
  }
  setInterval(updateNowLine,60000);
  renderGrid();
  updateAiBtnState();
  bindGridDropZones();
  bindGridMarquee();
}
document.addEventListener('DOMContentLoaded',init);
window.addEventListener('beforeunload',()=>saveNow(false));
</script>
