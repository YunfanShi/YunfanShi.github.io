<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

    <style>
        :root {
            --primary: #1a73e8;
            --primary-bg: #e8f0fe;
            --surface: #ffffff;
            --background: #f8f9fa;
            --text-main: #202124;
            --text-sub: #5f6368;
            --border: #dadce0;
            --shadow-card: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            --shadow-hover: 0 4px 8px 3px rgba(60,64,67,0.15);
            --anim-curve: cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        body {
            font-family: 'Google Sans', 'Roboto', sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* --- Header --- */
        header {
            text-align: center;
            padding: 60px 20px 40px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            background: #e6f4ea;
            color: #137333;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #1e8e3e;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        h1 {
            font-size: 40px;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 18px;
        }

        /* --- Sticky Navigation --- */
        .nav-container {
            position: sticky;
            top: 20px;
            z-index: 100;
            display: flex;
            justify-content: center;
            margin-top: -25px;
            margin-bottom: 40px;
            pointer-events: none;
        }

        .toggle-switch {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 6px;
            border-radius: 100px;
            display: flex;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .toggle-btn {
            padding: 12px 32px;
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-sub);
            cursor: pointer;
            z-index: 2;
            transition: color 0.3s;
            position: relative;
            font-family: 'Google Sans', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toggle-btn.active { color: var(--primary); }

        .slider {
            position: absolute;
            height: calc(100% - 12px);
            top: 6px;
            left: 6px;
            background: var(--primary-bg);
            border-radius: 90px;
            z-index: 1;
            transition: transform 0.4s var(--anim-curve), width 0.4s var(--anim-curve);
        }

        /* --- Content Layout --- */
        .content-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px 80px;
            opacity: 1;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .content-container.fading {
            opacity: 0;
            transform: translateY(10px);
        }

        .section-title {
            font-size: 22px;
            color: var(--text-main);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- Update Log (Timeline) --- */
        .global-log {
            background: var(--surface);
            border-radius: 24px;
            padding: 30px;
            box-shadow: var(--shadow-card);
            margin-bottom: 40px;
            border: 1px solid var(--border);
        }

        .log-section-label {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .log-section-label.major { color: #1a73e8; }
        .log-section-label.regular { color: var(--text-sub); margin-top: 24px; }

        .log-item {
            padding-bottom: 20px;
            border-left: 2px solid var(--border);
            padding-left: 20px;
            position: relative;
        }
        .log-item:last-child { border-left: 2px solid transparent; padding-bottom: 0; }

        .log-item.major::before {
            background: #d93025;
            border-color: #d93025;
            box-shadow: 0 0 0 2px rgba(217, 48, 37, 0.3);
        }
        .log-item.major {
            background: linear-gradient(135deg, rgba(255, 143, 0, 0.06), rgba(217, 48, 37, 0.06));
            border-left: 2px solid rgba(217, 48, 37, 0.5);
            border-radius: 0 12px 12px 0;
            padding: 12px 16px 20px 20px;
            margin-bottom: 6px;
        }
        .log-item.major .log-content { font-weight: 500; }

        .log-content-clamp {
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .log-expand-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 0 0;
            font-family: 'Google Sans', sans-serif;
        }
        .log-expand-btn:hover { text-decoration: underline; }

        .back-top-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Google Sans', sans-serif;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            transform: translateY(10px);
        }
        .back-top-btn.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .back-top-btn:hover { background: #1557b0; }

        .log-item::before {
            content: '';
            position: absolute;
            left: -7px;
            top: 0;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            border: 4px solid var(--surface);
        }

        .log-date { font-size: 12px; color: var(--text-sub); font-weight: 500; margin-bottom: 4px; }
        .log-content { font-size: 15px; line-height: 1.6; }

        /* --- Modules Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--surface);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--shadow-card);
            transition: all 0.3s var(--anim-curve);
            border: 1px solid transparent;
            display: flex;
            flex-direction: column;
            cursor: default;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            background: var(--primary-bg);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
        }

        .card-badge {
            font-size: 12px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 12px;
        }

        .card-badge.online { background: #e6f4ea; color: #137333; }
        .card-badge.beta { background: #fef7e0; color: #e37400; }
        .card-badge.offline { background: #fce8e6; color: #c5221f; }

        .module-name { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        .module-desc { font-size: 14px; color: var(--text-sub); line-height: 1.5; flex: 1; margin-bottom: 16px; }

        .update-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }

        .update-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 4px 0;
            color: var(--text-sub);
        }

        .update-row span:last-child { font-weight: 500; color: var(--text-main); }

        .action-btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 14px;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            text-decoration: none;
            font-family: 'Google Sans', sans-serif;
            box-sizing: border-box;
        }

        .action-btn:hover { background: #1557b0; }
    </style>
</head>

    <script>

                    { date: "2026-08-05 v3.10.0", content: "🤖 AI 助手性能大优化 - 大幅提升 AI 响应速度，不再卡顿！① 智能识别任务难度：简单问题（查时间、打招呼、算数）会直接秒答，不再绕圈思考；中等任务快速完成；复杂任务（制定学习计划、分析进度、批量调整）才会用深度思考模型慢慢分析，然后再快速执行，又快又准。② 每次提问消耗的算力大幅减少（减少约 85%），打开网站、调用 AI 都不再占用大量内存和 CPU，电脑不会再卡死。③ 修复了对话标题一直是「新对话」的问题，现在会自动根据你的提问生成标题。④ 修复了 AI 偶尔循环调用工具停不下来的问题。" },
                    { date: "2026-08-04 v3.8.0", content: "🕐 时间表编辑手感大升级 - 左侧任务池里的任务现在可以直接拖到右侧时间轴上排程，松手即安排到对应时间；已排任务块的上下边缘可以上下拉动自由调整时长（顶部=改开始时间，底部=改结束时间），相邻任务自动检测冲突不允许重叠；两个任务之间的空隙悬停会出现「＋」按钮，一键插入 15 分钟休息，后面的任务自动顺延，再也不用纠结怎么补休息时间。在时间轴空白处按住鼠标拖拽可以拉框多选多个任务，配合左侧「批量」操作一键延迟/删除/改优先级。目标页今日计划的总时长也改为更易读的「X小时X分钟」格式，不再是冷冰冰的分钟数。🤖 日程 AI 交互优化 - 日程中心的 AI 助手改为被动响应模式，不会在你没要求时主动推荐方案；如果某次排程结果不对，AI 会先重新读取真实数据核实，不再重复添加一堆重复任务副本。修复了之前反复操作导致时间表里出现多个重复未排程任务的问题。" },
                    { date: "2026-08-04 v3.7.0", content: "🎯 目标与学习体验全面升级 - 目标页面新增「学习进度」报告功能（右上角按钮），一键查看今日任务和任务记录日历，学习情况一目了然；更新目标进度时可以顺手填写使用时间（选填），记录更完整；新增计时悬浮小窗，可拖到屏幕任意位置，随时查看当前计时任务；推送日程到时间表时支持选择「从现在开始」或自定义起止时间，安排更灵活。📝 学习指南更新 - 康奈尔笔记的底部总结栏新增三种固定格式可选（核心概念类/零散知识点类/对比类），写总结更规范。🛠️ 体验优化 - 修复 CONTROL 页面倒计时上方显示「任务」而不是真实任务名的问题，现在会正确显示从日程中心同步过来的任务名；今日计划的 AI 分析区域可以收起/展开，界面更清爽。" },

                    { date: "2026-08-02 v3.3.0", content: "⏱️ 目标专注与日程生成器全面升级 - 目标页的计时器全新设计，现在会记录每次专注的「增长量」（比如学了24分钟完成了1章），并自动估算每个任务完成 1 个单位大约需要多少分钟，这个数据会同步给日程生成器用于智能排程；日程生成器现在可以导入目标页的所有子任务（每个子任务单独排程），并新增「间隔大休息」功能——小休息15分钟、大休息25分钟交替插入，让学习节奏更科学。" },

                                ${log.content.length > 100 ? `<button class="log-expand-btn" onclick="toggleLog(${i},'regular')">展开全文</button>` : ''}
                            </div>
                        `).join('')}
                        ` : ''}
                    </div>
                </section>
            `;

            const modulesHTML = `
                <section>
                    <div class="section-title">
                        <span class="material-symbols-rounded">grid_view</span>
                        功能模块状态
                    </div>
                    <div class="grid">
                        ${data.modules.map(mod => `
                            <div class="card">
                                <div class="card-header">
                                    <div class="card-icon">
                                        <span class="material-symbols-rounded">${mod.icon}</span>
                                    </div>
                                    <span class="card-badge ${mod.status}">${statusLabel[mod.status] || mod.status}</span>
                                </div>
                                <div class="module-name">${mod.name}</div>
                                <div class="module-desc">${mod.desc}</div>
                                <div class="update-info">
                                    <div class="update-row">
                                        <span>最近更新</span>
                                        <span>${mod.date}</span>
                                    </div>
                                    <div class="update-row">
                                        <span>状态</span>
                                        <span style="color:${mod.status === 'online' ? '#1e8e3e' : mod.status === 'beta' ? '#e37400' : '#c5221f'}">${statusLabel[mod.status] || mod.status}</span>
                                    </div>
                                </div>
                                <a href="${mod.link}" target="${mod.link.startsWith('http') ? '_blank' : '_top'}" class="action-btn">
                                    打开 ${mod.name}
                                </a>
                            </div>
                        `).join('')}
                    </div>
                </section>
            `;

            container.innerHTML = logsHTML + modulesHTML;
        }

        function toggleLog(idx, type) {
            const el = document.getElementById((type === 'major' ? 'mc' : 'rc') + idx);
            if (!el) return;
            const btn = el.nextElementSibling;
            const isClamped = el.classList.contains('log-content-clamp');
            if (isClamped) {
                el.classList.remove('log-content-clamp');
                btn.textContent = '收起';
            } else {
                el.classList.add('log-content-clamp');
                btn.textContent = '展开全文';
            }
        }

        // Back to top button
        const backBtn = document.getElementById('backTopBtn');
        if (backBtn) {
            window.addEventListener('scroll', () => {
                backBtn.classList.toggle('show', window.scrollY > 400);
            });
            backBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        init();
    </script>
</body>
</html>
