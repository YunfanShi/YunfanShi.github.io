<!doctype html>
<html lang="zh-CN">
<head>
<script src="/shared/error-notices.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1a73e8">
  <title>当前离线 · JackYun</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f6f8fc; color: #202124; }
    main { width: min(100%, 520px); padding: 34px; border: 1px solid #dadce0; border-radius: 28px; background: #fff; box-shadow: 0 18px 55px rgba(60,64,67,.13); }
    .icon { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 18px; background: #e8f0fe; color: #1a73e8; font-size: 30px; }
    h1 { margin: 24px 0 10px; font-size: 28px; letter-spacing: -.04em; }
    p { margin: 0; color: #5f6368; line-height: 1.7; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
    button, a { min-height: 44px; border-radius: 12px; padding: 0 18px; border: 1px solid #dadce0; font: inherit; font-weight: 650; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
    button { background: #1a73e8; color: #fff; border-color: #1a73e8; }
    a { color: #1a73e8; background: transparent; }
    small { display: block; margin-top: 22px; color: #80868b; line-height: 1.5; }
    @media (prefers-color-scheme: dark) {
      body { background: #000; color: #f5f5f5; }
      main { background: #101010; border-color: #303030; }
      p, small { color: #bdc1c6; }
      .icon { background: #174ea6; color: #d2e3fc; }
      a { color: #8ab4f8; border-color: #3c4043; }
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">↯</div>
    <h1>打开工作区</h1>
    <p>这个页面尚未保存在设备上。请返回已保存的工作区继续使用，本机内容与修改会保留。</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">重新打开</button>
      <a href="/dashboard">返回工作区</a>
    </div>
    <small id="status">可以继续使用已保存的页面</small>
  </main>
  <script>
    addEventListener('online', function () {
      document.getElementById('status').textContent = '网络已恢复，正在重新打开工作区…';
      location.reload();
    });
  </script>
</body>
</html>
