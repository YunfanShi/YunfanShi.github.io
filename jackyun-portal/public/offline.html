<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1a73e8">
  <title>离线页面 · JackYun</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; --background: #f6f8fc; --surface: #fff; --text: #202124; --muted: #505965; --border: #dadce0; --brand: #1559b8; }
    * { box-sizing: border-box; }
    [hidden] { display: none; }
    body { margin: 0; padding: clamp(16px, 5vw, 48px); background: var(--background); color: var(--text); }
    main { max-width: 42rem; margin: 0 auto; padding: clamp(20px, 5vw, 36px); border: 1px solid var(--border); border-radius: 24px; background: var(--surface); }
    h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 6vw, 2.2rem); }
    h2 { margin: 0 0 8px; font-size: 1.2rem; }
    p { margin: 0; color: var(--muted); line-height: 1.65; }
    section { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border); }
    ul { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; }
    button, a { min-height: 44px; padding: 10px 14px; border-radius: 12px; font: inherit; font-weight: 600; }
    button { margin-top: 16px; border: 0; background: var(--brand); color: var(--surface); cursor: pointer; }
    a { display: flex; flex-direction: column; justify-content: center; height: 100%; border: 1px solid var(--border); color: var(--brand); text-decoration: none; overflow-wrap: anywhere; }
    a:hover { text-decoration: underline; }
    small { font-weight: 400; color: var(--muted); }
    :focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
    @media (prefers-color-scheme: dark) {
      :root { --background: #101216; --surface: #191c21; --text: #f1f3f4; --muted: #bdc1c6; --border: #3c4043; --brand: #a8c7fa; }
    }
  </style>
</head>
<body>
  <main>
    <h1>离线页面</h1>
    <div id="retry" hidden>
      <p>暂时无法连接 JackYun。你可以打开保存在此设备上的页面，或重试当前页面。</p>
      <button type="button">重试当前页面</button>
    </div>
    <section aria-labelledby="saved-title">
      <h2 id="saved-title">此设备上已保存的页面</h2>
      <p id="status" role="status">正在查看本机缓存…</p>
      <ul id="saved" hidden></ul>
      <noscript><p>请启用 JavaScript 以查看已保存的页面。</p></noscript>
    </section>
  </main>
  <script>
    const retry = document.getElementById('retry');
    retry.hidden = location.pathname === '/offline.html';
    retry.querySelector('button').addEventListener('click', () => location.reload());

    const status = document.getElementById('status');
    const list = document.getElementById('saved');
    const labels = new Map([
      ['/dashboard', '工作区'], ['/schedule', '日程'], ['/study', '学习中心'],
      ['/study/tasks', '学习任务'], ['/reading', '阅读'], ['/review', '复习'],
      ['/goal', '目标'], ['/vocab', '词汇'], ['/memory', '记忆'],
      ['/practice-timer', '练习计时器'],
      ['/time-management', '时间管理'], ['/tools', '工具'], ['/settings', '设置'],
    ]);
    const unavailable = () => { status.textContent = '暂时无法读取本机缓存。'; };
    const worker = navigator.serviceWorker?.controller;
    if (!worker) {
      status.textContent = '请先联网访问 JackYun，待页面保存后即可离线打开。';
    } else {
      const channel = new MessageChannel();
      const timeout = setTimeout(() => { channel.port1.close(); unavailable(); }, 4000);
      channel.port1.onmessage = ({ data }) => {
        clearTimeout(timeout);
        channel.port1.close();
        if (data.unavailable) { unavailable(); return; }
        const routes = new Set(data.routes);
        const ordered = [...routes].sort((a, b) => {
          const rank = path => path === '/dashboard' ? 0 : path === '/practice-timer' ? 1 : 2;
          return rank(a) - rank(b) || a.localeCompare(b);
        });
        for (const route of ordered) {
          if (!route.startsWith('/')) continue;
          const url = new URL(route, location.origin);
          if (url.origin !== location.origin) continue;
          const item = document.createElement('li');
          const link = document.createElement('a');
          link.href = url.href;
          link.textContent = labels.get(url.pathname) ?? url.pathname;
          if (labels.has(url.pathname) || url.search) {
            const address = document.createElement('small');
            address.textContent = url.pathname + url.search;
            link.append(address);
          }
          item.append(link);
          list.append(item);
        }
        list.hidden = list.children.length === 0;
        status.textContent = list.hidden ? '此设备上还没有可用的离线页面。' : `共 ${list.children.length} 个页面，可以直接打开。`;
      };
      worker.postMessage({ type: 'GET_OFFLINE_STATUS' }, [channel.port2]);
    }
  </script>
</body>
</html>
