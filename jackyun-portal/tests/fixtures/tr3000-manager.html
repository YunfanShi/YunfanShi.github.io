<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Cudy TR3000 test fixture</title>
</head>
<body>
  <h1 id="page-title">终端设备</h1>
  <table id="devices">
    <tbody>
      <tr><td>1</td><td>测试手机<br>5G WiFi</td><td>192.168.10.25<br>AA:BB:CC:DD:EE:FF</td><td>0.00 Kbps</td><td>-50 dBm</td></tr>
    </tbody>
  </table>
  <button id="advanced" type="button">高级设置</button>
  <button id="qos-menu" type="button" hidden>QoS</button>
  <main id="qos-root"></main>
  <script>
    document.querySelector('#advanced').addEventListener('click', () => {
      document.querySelector('#qos-menu').hidden = false;
    });
    document.querySelector('#qos-menu').addEventListener('click', () => {
      const existingRule = new URLSearchParams(location.search).get('existing') === '1' ? `
        <tbody><tr>
          <td><input id="qos-mac" name="cbid.nft-qos.cfg01.mac" value="AA:BB:CC:DD:EE:FF"></td>
          <td><input id="qos-down" name="cbid.nft-qos.cfg01.ddrate" type="number" value="1250"><input name="cbid.nft-qos.cfg01.drunit" type="hidden" value="kbytes"></td>
          <td><input id="qos-up" name="cbid.nft-qos.cfg01.uurate" type="number" value="500"><input name="cbid.nft-qos.cfg01.urunit" type="hidden" value="kbytes"></td>
          <td><input id="qos-remark" name="cbid.nft-qos.cfg01.comment" value="旧备注"></td>
        </tr></tbody>` : '';
      document.querySelector('#qos-root').innerHTML = `
        <section class="modal fade in" role="dialog" style="display:block">
          <form>
            <h4 class="modal-title">QoS</h4>
            <table><thead><tr><th>MAC-Address</th><th>Download Rate</th><th>Upload Rate</th><th>Comment</th></tr></thead>${existingRule}</table>
            <button id="add-rule" type="button">Add</button>
            <button id="save-apply" type="button">Save &amp; Apply</button>
          </form>
        </section>`;
      document.querySelector('#add-rule').addEventListener('click', () => {
        document.querySelector('#add-rule').dataset.clicked = '1';
        document.querySelector('#qos-root table').insertAdjacentHTML('beforeend', `
          <tbody><tr>
            <td><input id="qos-mac" name="cbid.nft-qos.cfg01.mac"></td>
            <td><input id="qos-down" name="cbid.nft-qos.cfg01.ddrate" type="number"><input name="cbid.nft-qos.cfg01.drunit" type="hidden" value="kbytes"></td>
            <td><input id="qos-up" name="cbid.nft-qos.cfg01.uurate" type="number"><input name="cbid.nft-qos.cfg01.urunit" type="hidden" value="kbytes"></td>
            <td><input id="qos-remark" name="cbid.nft-qos.cfg01.comment"></td>
          </tr></tbody>`);
      });
      document.querySelector('#save-apply').addEventListener('click', (event) => {
        event.currentTarget.dataset.clicked = '1';
        document.querySelector('#qos-root form').insertAdjacentHTML('beforeend', '<div class="alert alert-success">Configuration applied.</div>');
      });
    });
  </script>
  <script>
    const gmStore = new Map();
    if (new URLSearchParams(location.search).get('auto') === '1') {
      gmStore.set('jy_tr3000_config', { safeMode: false, open: true, fullPage: true });
    }
    window.GM_getValue = (key, fallback) => gmStore.has(key) ? gmStore.get(key) : fallback;
    window.GM_setValue = (key, value) => {
      gmStore.set(key, value);
      document.documentElement.dataset.gmKeys = [...gmStore.keys()].join(',');
      if (key.endsWith('pendingNative')) document.documentElement.dataset.gmPending = JSON.stringify(value);
      if (key.endsWith('logs')) document.documentElement.dataset.gmLogs = JSON.stringify(value);
    };
    window.GM_setClipboard = () => {};
    window.GM_registerMenuCommand = () => {};
  </script>
  <script src="../../public/userscripts/tr3000-manager.user.js"></script>
</body>
</html>
